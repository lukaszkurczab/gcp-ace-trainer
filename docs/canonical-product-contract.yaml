        success: verificationPending
        failureTransitions:
          - { failures: [rateLimited, offline, remoteFailure], to: verificationPending }
      - id: changePendingEmail
        surfaceId: verifyIdentity
        from: [verificationPending]
        inProgress: verificationPending
        success: verificationPending
        failureTransitions:
