      - id: completeInitialSync
        surfaceId: dataAdoption
        from: [authenticatedSyncing]
        inProgress: authenticatedSyncing
        success: authenticatedReady
        failureTransitions:
          - { failures: [adoptionConflict, remoteFailure], to: authenticatedSyncing }
          - { failures: [offline], to: authenticatedSyncing }
      - id: enterOffline
        surfaceId: syncStatus
        from: [authenticatedReady]
        inProgress: offlineAuthenticated
        success: offlineAuthenticated
        failureTransitions: []
      - id: restoreNetwork
        surfaceId: syncStatus
        from: [offlineAuthenticated]
