        success: authenticatedSyncing
        failureTransitions:
          - { failures: [invalidCredential, revokedSession, rateLimited, offline, remoteFailure], to: reauthenticationRequired }
      - id: signOut
        surfaceId: signOut
        from: [authenticatedSyncing, authenticatedReady, offlineAuthenticated, reauthenticationRequired]
        inProgress: signingOut
        success: signedOut
        failureTransitions:
          - { failures: [journalRecoveryFailure, pendingSyncRequiresNetwork, exportRequired, localDeletionFailure], to: exactSourceState }
      - id: deleteAccount
