version: 2
contractId: patternly-product-contract
authority:
  normativeSource: canonical-product-contract
  narrativeDocuments: non-normative
requirements:
  - id: CONTRACT-AUTHORITY-001
    statement: Product behavior is normative only when defined by this contract.
  - id: ACCOUNT-ENTRY-IDENTITY-001
    statement: Public-launch learning is guest-first through a local installation identity; an account and verified identity are required for Premium, synchronization, restore, and cross-device continuity, not for first learning value.
  - id: ACCOUNT-LIFECYCLE-001
    statement: Every account command has one declared success transition and explicit invalid, duplicate, expired, used, rate-limited, offline, revoked-session, and remote-failure outcomes without account enumeration, fake success, or an anonymous bypass.
  - id: ACCOUNT-DATA-AUTHORITY-001
    statement: The canonical local repositories are the durability authority for one device and one revisioned remote account dataset is the cross-device convergence authority; device-only records never sync and no second learning-data path may exist.
  - id: ACCOUNT-DATA-ADOPTION-001
    statement: First account binding resolves empty, local-only, remote-only, both-populated, active-guest-session, and divergent-record cases through a previewed deterministic plan and explicit confirmation, never a silent merge, overwrite, or discard; an active guest session must finish or be explicitly abandoned.
  - id: ACCOUNT-SYNC-CONFLICT-001
    statement: Verified local mutations enter one ordered sync outbox, remote writes use compare-and-swap account revisions, and stale, colliding, or irreconcilable records expose a blocking conflict without changing the last verified local or remote state.
  - id: ACCOUNT-OFFLINE-SESSION-001
    statement: Guests and previously verified bound accounts may continue local-first learning offline from verified local content, while identity, Premium, synchronization, restore, destructive account actions, and remote confirmation expose explicit network-dependent states.
  - id: ACCOUNT-SIGNOUT-DELETION-001
    statement: Sign-out removes account credentials and account-owned local records only after pending mutations are synchronized or explicitly exported and discarded; account deletion requires reauthentication, revokes sessions, verifies remote and local deletion, exposes failure, and supports a possession-verified public request path.
  - id: ACCOUNT-SECURITY-PRIVACY-001
    statement: Account transport, credential storage, transmitted learning fields, retention, deletion proof, logging exclusions, email delivery, and verified HTTPS link boundaries are explicit and must not be represented as implemented until their mechanisms pass provider and signed-build verification.
  - id: ACCOUNT-PREMARKET-HOSTING-001
    statement: Development and sandbox may use the default Firebase domain, while production promotion requires the same canonical web artifact to use environment-driven professional public, authentication, legal, support, deletion, association, redirect, and sender origins.
  - id: ACCOUNT-SURFACE-MAP-001
    statement: The launch account lifecycle has one declared surface map for entry, registration, verification, sign-in, recovery, reset, expired session, reauthentication, profile, adoption, sync status, conflict, sign-out, and deletion without placeholder routes.
  - id: CODING-INTERVIEW-MODE-MATRIX-001
    statement: Coding Interview exposes exactly the declared mode matrix, including each mode's session, scope, feedback, timer, shortening, and reinsert behavior.
  - id: CODING-INTERVIEW-CUSTOM-PRACTICE-001
    statement: Custom Practice accepts only 10, 20, or 40 items and explicit afterEachAnswer or atSessionEnd feedback, uses the Guided Practice blueprint for an explicitly selected mental unit, and shares the one-active-session lifecycle with profile-owned reinsert.
  - id: CODING-INTERVIEW-INDEPENDENT-PRACTICE-001
    statement: Independent Practice uses one explicitly selected declared interleaved scope, defaults to ten items, supports only ten or twenty items, exposes feedback after each durable answer, and never invents a forty-item session or substitute scope.
  - id: CODING-INTERVIEW-PROGRESS-EVIDENCE-001
    statement: Coding Interview Progress keeps every supported topic available, separates an explained recommendation from access, and presents only recorded current-content practice evidence without mastery, retention, readiness, locks, or an invented zero score.
  - id: TRACK-PRESENTATION-001
    statement: Learners see concrete registered tracks only; internal family identifiers never appear as categories, filters, headings, or marketing sections, and unknown registrations fail explicitly without substitution.
  - id: RESEARCH-BUILD-SETTINGS-001
    statement: Launch Settings exposes only complete product destinations and explicit unavailable states; obsolete moderated-research scope does not define launch product behavior.
  - id: APP-IDENTITY-001
    statement: The application has one Patternly build identity across npm, Expo, iOS, Android, dev-client links, runtime audit links, RC runners, and Maestro while preserving the canonical versioned local-learning data keys.
  - id: USER-TESTING-CORE-JOURNEY-001
    statement: Core-journey evidence preserves durable leave-and-resume, canonical summary, and recorded Progress behavior without making the historical moderated-research packet a product authority.
  - id: CODING-INTERVIEW-CUSTOM-IMMEDIATE-FEEDBACK-001
    statement: Custom Practice with afterEachAnswer journals and materializes each submitted response before exposing that item's feedback, advances only after the durable response, and finalizes one canonical session result.
  - id: CODING-INTERVIEW-CUSTOM-DEFERRED-FEEDBACK-001
    statement: Custom Practice with atSessionEnd keeps correctness, Reason, Details, and distractor explanations unavailable after every durable per-item submission until its canonical completed result is loaded.
  - id: CODING-INTERVIEW-CUSTOM-DEFERRED-SUMMARY-001
    statement: A completed Custom Practice atSessionEnd session reloads its complete feedback only from the durable canonical result after application relaunch.
  - id: CODING-INTERVIEW-CUSTOM-REINSERT-OWNERSHIP-001
    statement: Custom Practice resolves its eligible and skipped conditional reinsert slots only from the profile-owned policy and rejects every learner reinsert override before session preparation.
  - id: CODING-INTERVIEW-REINSERT-POLICY-001
    statement: Coding Interview reinsert permits one eligible incorrect or partial source attempt after at least three intervening durable submissions, preferring a compatible reviewed variant then an exact-source fallback, and skips when no valid slot exists.
  - id: CERTIFICATION-MODE-MATRIX-001
    statement: Certification exposes exactly seven declared modes, each owned by the certification family and the representative GCP ACE track with an explicit normative learning configuration; implementation and verification status live outside this contract.
  - id: CERTIFICATION-DIAGNOSTIC-BASELINE-001
    statement: Certification Diagnostic Baseline uses its approved shared practice flow with exactly forty unique blueprint items, no selectors, shortening, or reinsert, elapsed foreground time, feedback after each durable response, and a domain breakdown summary.
  - id: CERTIFICATION-FOCUS-PRACTICE-001
    statement: Certification Focus Practice requires one explicitly selected Cloud domain, accepts only ten, twenty, or forty requested items, never fills from a sibling domain, and may shorten only within the selected domain.
  - id: CERTIFICATION-SCENARIO-PRACTICE-001
    statement: Certification Scenario Practice requires one explicitly selected competency, accepts only ten, twenty, or forty requested items, selects only its approved scenario items, and may shorten only within that competency.
  - id: CERTIFICATION-WEAK-AREA-REVIEW-001
    statement: Certification Weak Area Review accepts only ten or twenty requested items, selects only current-content due review evidence, may shorten only within that eligible evidence, never substitutes ordinary practice when the queue is empty, and resolves an entry only after two consecutive successful due review sessions.
  - id: CERTIFICATION-MIXED-PRACTICE-001
    statement: Certification Mixed Practice accepts only ten, twenty, or forty requested items, uses its versioned unique interleaved blueprint in declared order, and may shorten only within that blueprint.
  - id: CERTIFICATION-QUICK-REVIEW-001
    statement: Certification Quick Review selects at most ten current-content due review items in deterministic due order, may shorten only within that eligible evidence, never fills from future or unrelated content, and resolves an entry only after two consecutive successful due review sessions.
  - id: USER-COMMAND-MODEL-001
    statement: Every canonical session CTA maps to exactly one declared application command; a non-final simulation CTA maps only to the atomic save-and-continue application command.
  - id: USER-COMMAND-RESUME-001
    statement: Resume is distinct from recover because a user-facing Resume CTA restores an active session, while recover replays a pending durable mutation.
  - id: SIMULATION-SAVE-AND-CONTINUE-001
    statement: The save-and-continue user action for a non-final Coding Interview simulation occurrence is represented by one application command that accepts the active occurrence and a complete response.
  - id: SIMULATION-SAVE-AND-CONTINUE-VERIFICATION-001
    statement: Save-and-continue verifies the durable draft revision and persisted response before it advances exactly one occurrence and publishes the verified next simulation projection.
  - id: SIMULATION-SAVE-AND-CONTINUE-RECOVERY-001
    statement: If save-and-continue persists a response but does not verify its advance, it exposes explicit recovery that advances only from the durable response without creating another draft revision.
  - id: SIMULATION-SAVE-AND-CONTINUE-CTA-001
    statement: Every non-final Coding Interview simulation response CTA is labelled Save and continue, is disabled until complete, and invokes only the save-and-continue application command.
  - id: SIMULATION-FINAL-OCCURRENCE-001
    statement: At the final Coding Interview simulation occurrence, a changed complete response is saved as a durable draft before the canonical finish confirmation is exposed; an unchanged unanswered final occurrence exposes that same finish confirmation.
  - id: SIMULATION-SAVE-AND-JUMP-001
    statement: The Coding Interview simulation navigator-jump command saves a changed local response as a verified durable draft before it publishes the requested occurrence; a navigator interaction never silently discards that response.
  - id: SIMULATION-RELAUNCH-001
    statement: After the first Coding Interview simulation response saves and advances, a new composition root restores its durable response, second occurrence, timer checkpoint, and exactly one active session.
  - id: SIMULATION-SAVE-AND-CONTINUE-IDEMPOTENCY-001
    statement: Duplicate concurrent save-and-continue commands for the same active Coding Interview simulation occurrence and response share one durable draft save and one verified advance.
  - id: SIMULATION-FULL-LIFECYCLE-001
    statement: The complete immutable forty-occurrence Coding Interview simulation plan finalizes into one result with forty distinct answered occurrences and no active session or durable draft.
  - id: SIMULATION-TIMER-UI-REFRESH-001
    statement: The visible Coding Interview simulation timer formats the runtime remaining-foreground projection every second without a durable write for each UI refresh.
  - id: SIMULATION-TIMER-CHECKPOINT-INTERVAL-001
    statement: Coding Interview simulation periodic durable checkpoints use the declared fifteen-second interval and one-second maximum drift, producing one durable write per due interval.
  - id: SIMULATION-TIMER-BACKGROUND-CHECKPOINT-001
    statement: Leaving Coding Interview simulation foreground durably checkpoints its active segment before background time begins, and background duration never reduces its countdown.
  - id: SIMULATION-TIMER-FINALIZATION-CHECKPOINT-001
    statement: Manual Coding Interview simulation finalization durably checkpoints the active foreground segment before it freezes the result, so finalization observes that verified elapsed time.
  - id: SIMULATION-TIMER-MUTATION-SERIALIZATION-001
    statement: Coding Interview simulation timer checkpoints, draft saves, and navigation share one mutation lane and do not overwrite a durable draft revision or current position.
  - id: SIMULATION-TIMER-FORCE-CLOSE-BOUNDARY-001
    statement: Coding Interview simulation force-close immediately before and after the periodic checkpoint boundary restores only its last verified foreground time within the declared one-second drift bound.
  - id: SIMULATION-ACTIVE-SCREEN-FIDELITY-001
    statement: The approved active Coding Interview simulation screen fills its viewport and presents the timer, counter, active question, save state, and leave/save actions without an inline question navigator.
  - id: SIMULATION-NAVIGATOR-FIDELITY-001
    statement: The approved Coding Interview simulation question navigator exposes exactly forty positions in reading order with current, answered-and-saved, and unanswered states, adapts to four columns at larger text sizes, and labels every position without showing correctness.
  - id: SIMULATION-OPERATION-STATE-ACTIONS-001
    statement: The approved Coding Interview simulation operation states render only the state and CTA actions returned by the application layer; a save failure may explicitly resume local editing only when no response was durably saved, and no generic retry is rendered.
  - id: SIMULATION-ACCESSIBILITY-001
    statement: Interactive Coding Interview simulation controls provide a 48-point target, navigator errors retain their retry CTA as a separate focusable element, and the navigator removes its transition when the operating system enables Reduce Motion.
  - id: SESSION-STATE-MACHINE-001
    statement: Practice and simulation expose only their declared durable operation states and triggered transitions; recovery returns only the state declared for the recovered durable mutation.
  - id: SIMULATION-CONCURRENCY-001
    statement: "A simulation has one active session mutation lane: save, navigation, timer checkpoint, foreground transition, finalization, and abandonment are FIFO-serialized with at most one in flight, and revalidate the active session immediately before execution."
  - id: SIMULATION-TIMER-CADENCE-001
    statement: "Simulation timer projections refresh every second without a durable write; durable checkpoints occur every 15 seconds with at most one second of drift and at every declared lifecycle checkpoint."
  - id: NARRATIVE-DOCS-CANONICALIZATION-001
    statement: Narrative documents reference the canonical contract and do not maintain competing mode matrices or fixed configuration values.
  - id: DESIGN-REFERENCE-REGISTRY-001
    statement: Actual visual work may be approved only by the Product Owner, Figma is temporary design-phase authority, and repository-owned tokens, assets, production components, Storybook, tests, and baselines become operational authority after verified handoff without a production Figma or Storybook dependency.
  - id: COMMERCIAL-ENTITLEMENT-001
    statement: Patternly provides permanent Free access and one account-bound Premium entitlement for all Premium content through one monthly and one annual product, with no tiers or track slots and with store, RevenueCat, backend, and bounded-device-cache authority kept distinct.
  - id: GUEST-FREE-001
    statement: A local-installation guest reaches meaningful bundled free-node learning without registration, cannot purchase or download Premium, and adopts progress only through preview, explicit confirmation, deterministic reconciliation, and a finish-or-abandon active-session boundary.
  - id: GUEST-INSTALLATION-001
    statement: Before recovery or content navigation, bootstrap provisions and verifies exactly one opaque local installation ID and local dataset ID in a guest-bound canonical record; a corrupt, unsupported, identity-generation, or durable-write failure blocks without replacement or a partial guest record.
  - id: IDENTITY-SECURITY-001
    statement: Email/password, Apple, Google, and eight one-time recovery codes resolve to one Firebase UID and Patternly account with proof-based linking, no email-only merge, protected unlinking, recent reauthentication, and session revocation.
  - id: ENVIRONMENT-PUBLIC-LINKS-001
    statement: Public, authentication, legal, support, deletion, association, and sender origins are environment-driven; ordinary Firebase action-code expiry is provider-controlled while only the custom public-deletion token is exactly thirty minutes.
  - id: APPROVED-CLIENT-ENVIRONMENT-001
    statement: App-side remote client categories use one closed public configuration schema with an explicit HTTPS API origin and only sandbox or production environments; an absent local configuration remains explicitly unconfigured and cannot choose an endpoint or send data.
  - id: DEVICE-SESSION-SYNC-001
    statement: Current track and compact completed learning facts synchronize incrementally, while the active session, pointer, draft, position, timer, and mutation journal are device-owned and never synchronize or resume across devices.
  - id: PRODUCT-SURFACES-GOALS-001
    statement: Primary tabs are Today, Practice, Progress, and Settings, Activity is nested under Progress, and per-track goals affect recommendations and cadence without affecting entitlement, locking, scoring, mastery, streaks, or punitive messaging.
  - id: LEARNING-PRODUCTS-001
    statement: Certification, coding_interview, and design_interview are internal-only families; ten equal-status target track briefs are required, and no track enters the production registry without a real free vertical and complete core loop.
  - id: TRACK-REGISTRY-ADMISSION-001
    statement: The non-production density harness pins exactly the ten canonical track briefs, and the admission evaluator rejects every registration that lacks descriptor-backed factual evidence of its bundled free node and complete core loop.
  - id: FREE-NODE-EXPERIENCE-PROFILE-001
    statement: "Every implemented production track owns exactly one versioned closed Free-node experience profile: it is a subset of the track's complete validModes, uses only existing family mode IDs and canonical runners, defines only node-local configuration, and never creates a Free-only mode, runner, scoring path, or lifecycle."
  - id: FREE-NODE-PACKAGE-ADMISSION-001
    statement: "A production Free-node package is admitted only from immutable factual package evidence that binds one track, one freeNodeId, one versioned Free-node experience profile, pinned inventory and release provenance, deterministic bytes and checksum, an immediately executable primary session, and node-closed immediate and evidence-conditioned modes; a brief alone is not admission evidence."
  - id: TRACK-IDENTITY-CUTOVER-001
    statement: Active registries and published artifacts use only coding_interview, coding-interview-dsa-problem-solving, and google-cloud-associate-cloud-engineer; algorithms and cloud-certification are not aliases, and persisted former track identities fail explicitly without translation or substitution.
  - id: CONTENT-PACKAGES-001
    statement: Complete Free nodes are bundled and Premium content uses immutable compressed whole-node packages authorized by Cloud Run, checksum and semantic validation, atomic activation, exact session pinning, and active-session-safe cache retention without per-question Firestore fetching or silent substitution.
  - id: ANALYTICS-REPORTS-001
    statement: Firebase Analytics and Crashlytics are fail-closed behind privacy and consent, events use a closed redacted vocabulary, and content reports are account-unlinked by default with bounded context, explicit linking consent, retention, and offline retry states.
  - id: BACKUP-RESTORE-001
    statement: Production Firestore targets seven-day point-in-time recovery for disaster recovery only, with a restore runbook, sanitized drill, deletion-tombstone reconciliation, and an absolute prohibition on deleted-account resurrection.
  - id: PLATFORM-RELEASE-001
    statement: The target release uses Expo SDK 57, iOS 16.4 or later on iPhone only, Android API 28 minimum and API 36 target, portrait, Light Dark and System appearances, 200 percent text scaling, and signed physical-device evidence on both platforms.
  - id: BRAND-DESIGN-AUTHORITY-001
    statement: Patternly is one focused flagship brand with subordinate track accents, a controlled 3-to-2-to-1 owner-approved Figma phase, restrained accessible motion and haptics, repository-owned handoff, and CODE_CANONICAL independence from paid Figma.
