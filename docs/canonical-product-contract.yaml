      testName: locks FIFO serialization for every simulation mutation of one active session
      requirementIds: [SIMULATION-CONCURRENCY-001]
    - id: canonical-simulation-timer-cadence
      testPath: tests/canonicalProductContract.test.ts
      testName: defines the versioned simulation timer cadence without per-refresh durable writes
