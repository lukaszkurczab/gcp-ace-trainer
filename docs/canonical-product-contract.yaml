    - id: canonical-algorithms-mode-matrix
      testPath: tests/canonicalProductContract.test.ts
      testName: defines exactly the complete canonical Algorithms mode matrix
      requirementIds: [ALGORITHMS-MODE-MATRIX-001]
    - id: canonical-custom-practice-contract
      testPath: tests/canonicalProductContract.test.ts
      testName: locks the Custom Practice contract required by ALGORITHMS-CUSTOM-PRACTICE-001
      requirementIds: [ALGORITHMS-CUSTOM-PRACTICE-001]
    - id: custom-practice-immediate-feedback-flow
      testPath: tests/customPracticeImmediateFeedback.test.ts
      testName: Custom Practice afterEachAnswer journals each submitted response, exposes immediate feedback, advances, and finalizes one summary
