        from: [authenticatedReady, deletionFailed]
        inProgress: deletionPending
        success: deleted
        failureTransitions:
          - { failures: [journalRecoveryFailure], to: exactSourceState }
          - { failures: [reauthenticationRequired], to: reauthenticationRequired }
