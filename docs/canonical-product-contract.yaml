      requirementIds: [SIMULATION-TIMER-BACKGROUND-CHECKPOINT-001]
    - id: algorithms-simulation-timer-finalization-checkpoint
      testPath: tests/algorithmsSimulationTimerFacade.test.ts
      testName: manual finalization checkpoints the active foreground segment before it freezes the result
      requirementIds: [SIMULATION-TIMER-FINALIZATION-CHECKPOINT-001]
    - id: algorithms-simulation-timer-mutation-serialization
      testPath: tests/durableSimulationResponseSave.test.ts
      testName: concurrent timer checkpoint and save-and-continue retain the draft revision and next position
      requirementIds: [SIMULATION-TIMER-MUTATION-SERIALIZATION-001]
    - id: algorithms-simulation-timer-force-close-boundary
      testPath: tests/algorithmsSimulationTimerFacade.test.ts
      testName: force-close immediately before and after the checkpoint boundary resumes within the declared drift
      requirementIds: [SIMULATION-TIMER-FORCE-CLOSE-BOUNDARY-001]
    - id: simulation-active-screen-fidelity
      testPath: tests/simulationSessionSurface.test.ts
      testName: active simulation surface fills the viewport and keeps navigator presentation outside the approved active screen
      requirementIds: [SIMULATION-ACTIVE-SCREEN-FIDELITY-001]
    - id: simulation-navigator-fidelity
      testPath: tests/simulationNavigator.test.ts
      testName: simulation question navigator has the approved states, accessible labels, and large-text grid adaptation
      requirementIds: [SIMULATION-NAVIGATOR-FIDELITY-001]
    - id: simulation-operation-state-rendering
      testPath: tests/simulationOperationSurface.test.ts
      testName: simulation operation surface renders only declared state actions and never a generic retry
      requirementIds: [SIMULATION-OPERATION-STATE-ACTIONS-001]
    - id: simulation-operation-state-resume-editing
      testPath: tests/durableSimulationResponseSave.test.ts
      testName: a non-durable simulation save failure can explicitly resume local editing without a durable write
      requirementIds: [SIMULATION-OPERATION-STATE-ACTIONS-001]
    - id: simulation-accessibility
      testPath: tests/algorithmsSessionAccessibility.test.ts
      testName: simulation accessibility respects motion, focus, and touch-target constraints
      requirementIds: [SIMULATION-ACCESSIBILITY-001]
    - id: canonical-session-state-machine
      testPath: tests/canonicalProductContract.test.ts
      testName: defines the closed durable session state machines and accepts only declared triggered transitions
      requirementIds: [SESSION-STATE-MACHINE-001]
    - id: canonical-simulation-concurrency
