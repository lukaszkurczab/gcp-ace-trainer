    - id: next
    - id: save
    - id: save-and-continue
    - id: navigator-jump
    - id: finish
    - id: leave-resumable
    - id: abandon
    - id: recover
    - id: resume
  sessionCtaMappings:
    - ctaId: practice-submit
      commandId: submit
    - ctaId: practice-next
      commandId: next
    - ctaId: practice-finish
      commandId: finish
    - ctaId: practice-leave-resumable
      commandId: leave-resumable
    - ctaId: practice-abandon
      commandId: abandon
    - ctaId: practice-recover
      commandId: recover
    - ctaId: simulation-save
      commandId: save
    - ctaId: simulation-save-and-continue
      commandId: save-and-continue
    - ctaId: simulation-navigator-jump
      commandId: navigator-jump
    - ctaId: simulation-finish
      commandId: finish
    - ctaId: simulation-leave-resumable
      commandId: leave-resumable
    - ctaId: simulation-abandon
      commandId: abandon
    - ctaId: simulation-recover
      commandId: recover
    - ctaId: session-resume
      commandId: resume
sessionStateMachine:
  practice:
    initialState: unanswered
    states: [unanswered, submitting_before_journal, submit_journal_failed, commit_pending, commit_materialization_failed, commit_verification_failed, verified_pending_clear, recovery_required, feedback, advancing, advance_failed, completing, completion_failed, completed, abandoning, abandonment_failed_before_journal, abandonment_recovery_required, abandoned]
    transitions:
      - { from: unanswered, trigger: submit, to: submitting_before_journal }
      - { from: unanswered, trigger: abandon, to: abandoning }
      - { from: submitting_before_journal, trigger: validation_rejected, to: unanswered }
      - { from: submitting_before_journal, trigger: journal_write_failed, to: submit_journal_failed }
      - { from: submitting_before_journal, trigger: materialization_failed, to: commit_materialization_failed }
      - { from: submitting_before_journal, trigger: verification_failed, to: commit_verification_failed }
      - { from: submitting_before_journal, trigger: submit_verified, to: feedback }
      - { from: submit_journal_failed, trigger: submit, to: submitting_before_journal }
      - { from: commit_pending, trigger: recover, to: unanswered }
      - { from: commit_materialization_failed, trigger: recover, to: feedback }
      - { from: commit_verification_failed, trigger: recover, to: feedback }
      - { from: verified_pending_clear, trigger: recover, to: feedback }
      - { from: recovery_required, trigger: recover, to: unanswered }
      - { from: feedback, trigger: next, to: advancing }
      - { from: feedback, trigger: abandon, to: abandoning }
      - { from: advancing, trigger: advance_verified, to: unanswered }
      - { from: advancing, trigger: advance_failed, to: advance_failed }
      - { from: advance_failed, trigger: next, to: advancing }
      - { from: abandoning, trigger: abandonment_verified, to: abandoned }
      - { from: abandoning, trigger: abandonment_before_journal_failed, to: abandonment_failed_before_journal }
      - { from: abandoning, trigger: abandonment_recovery_required, to: abandonment_recovery_required }
      - { from: abandonment_failed_before_journal, trigger: abandon, to: abandoning }
  simulation:
    initialState: editable
    states: [editable, saving, save_failed, stale_revision, navigating, navigation_failed, save_and_continue_advance_recovery, frozen, finalization_journal_pending, finalization_journal_failed, materializing, materialization_failed, verifying, verification_failed, verified_pending_clear, recovery_required, timer_recovery_failed, missing_draft, version_mismatch, corrupt_state, abandoning, abandonment_failed_before_journal, abandonment_recovery_required, abandoned, completed]
    transitions:
      - { from: editable, trigger: save, to: saving }
      - { from: editable, trigger: navigator_jump, to: navigating }
      - { from: editable, trigger: finish, to: frozen }
      - { from: editable, trigger: abandon, to: abandoning }
      - { from: saving, trigger: save_verified, to: editable }
      - { from: saving, trigger: save_failed, to: save_failed }
      - { from: saving, trigger: stale_revision, to: stale_revision }
      - { from: save_failed, trigger: save, to: saving }
      - { from: stale_revision, trigger: save, to: saving }
      - { from: navigating, trigger: navigation_verified, to: editable }
      - { from: navigating, trigger: navigation_failed, to: navigation_failed }
      - { from: navigating, trigger: advance_not_verified_after_saved_response, to: save_and_continue_advance_recovery }
      - { from: navigation_failed, trigger: navigator_jump, condition: durable_state_not_durable, to: navigating }
      - { from: navigation_failed, trigger: reconstruct, condition: journal_status_durable, to: materializing }
      - { from: navigation_failed, trigger: reconstruct, condition: journal_status_materialized, to: verifying }
      - { from: navigation_failed, trigger: reconstruct, condition: journal_status_verified_pending_clear, to: verified_pending_clear }
      - { from: save_and_continue_advance_recovery, trigger: recover, to: navigating }
      - { from: frozen, trigger: finalization_started, to: finalization_journal_pending }
      - { from: finalization_journal_pending, trigger: finalization_verified, to: completed }
      - { from: finalization_journal_pending, trigger: journal_write_failed, to: finalization_journal_failed }
      - { from: finalization_journal_pending, trigger: materialization_failed, to: materialization_failed }
      - { from: finalization_journal_pending, trigger: verification_failed, to: verification_failed }
      - { from: finalization_journal_failed, trigger: finish, to: frozen }
      - { from: materializing, trigger: recover, condition: recovered_active_session, to: editable }
      - { from: verifying, trigger: recover, condition: recovered_active_session, to: editable }
      - { from: verified_pending_clear, trigger: recover, condition: recovered_active_session, to: editable }
      - { from: abandoning, trigger: abandonment_verified, to: abandoned }
      - { from: abandoning, trigger: abandonment_before_journal_failed, to: abandonment_failed_before_journal }
      - { from: abandoning, trigger: abandonment_recovery_required, to: abandonment_recovery_required }
      - { from: abandonment_failed_before_journal, trigger: abandon, to: abandoning }
      - { from: abandonment_recovery_required, trigger: reconstruct, condition: journal_status_durable, to: materializing }
      - { from: abandonment_recovery_required, trigger: reconstruct, condition: journal_status_materialized, to: verifying }
      - { from: abandonment_recovery_required, trigger: reconstruct, condition: journal_status_verified_pending_clear, to: verified_pending_clear }
simulationConcurrency:
  scope: oneActiveSession
  queueDiscipline: fifo
  maxInFlight: 1
  revalidateActiveSessionAtExecution: true
  mutationKinds: [save, navigation, timer-checkpoint, foreground-transition, finalization, abandonment]
simulationTimerCadence:
  version: 1
  uiRefreshIntervalMs: 1000
  uiRefreshWritesDurably: false
  durableCheckpointIntervalMs: 15000
  maxDurableCheckpointDriftMs: 1000
  lifecycleCheckpoints: [foreground-enter, foreground-leave, draft-save, finalization, expiry]
designReferences:
  version: 1
  references:
    - id: algorithms-active-simulation-screen
      screenStateTarget: algorithms-interview-simulation-active-question
      patternPath: docs/designs/algorithms_active_simulation/t29-active-simulation-reference.png
      version: 1
      approvalStatus: APPROVED
      owner: product-owner
  uiOwnership:
    - sourcePathPrefix: src/features/simulation/
      designReferenceId: algorithms-active-simulation-screen
algorithms:
  customPractice:
    modeId: algorithms-custom-practice
    contentBlueprintModeId: algorithms-guided-practice
    mentalUnitSelection: explicit
    reinsertOwnership: profile
    lifecycle: sharedOneActiveSession
  reinsertPolicy:
    version: 1
    eligibleResultKinds: [incorrect, partial]
    maxReinsertsPerSource: 1
    minInterveningDurableSubmissions: 3
    variantSelectionOrder: [compatibleReviewedVariant, exactSourceFallback]
    missingValidSlot: skip
  modes:
    - id: algorithms-learn-approach
      label: Learn Approach
      lengths:
        default: 10
        supported: [10]
      scope: oneMentalUnit
      shortening: allowed
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer]
      timer:
        kind: elapsedForeground
      reinsert: false
    - id: algorithms-guided-practice
      label: Guided Practice
      lengths:
        default: 20
        supported: [10, 20, 40]
      scope: oneMentalUnit
      shortening: allowed
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer]
      timer:
        kind: elapsedForeground
      reinsert: true
    - id: algorithms-custom-practice
      label: Custom Practice
      lengths:
        default: 20
        supported: [10, 20, 40]
      scope: guidedPracticeBlueprintForSelectedMentalUnit
      shortening: allowed
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer, atSessionEnd]
      timer:
        kind: elapsedForeground
      reinsert: true
    - id: algorithms-recognize-patterns
      label: Recognize Patterns
      lengths:
        default: 20
        supported: [10, 20, 40]
      scope: declaredRecognitionSet
      shortening: allowed
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer]
      timer:
        kind: elapsedForeground
      reinsert: false
    - id: algorithms-contrast-practice
      label: Contrast Practice
      lengths:
        default: 20
        supported: [10, 20, 40]
      scope: declaredContrastSet
      shortening: allowed
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer]
      timer:
        kind: elapsedForeground
      reinsert: false
    - id: algorithms-weak-area-review
      label: Weak Area Review
      lengths:
        default: 10
        supported: [10, 20]
      scope: eligibleDueReviewOrCompletedSessionMisses
      shortening: allowed
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer]
      timer:
        kind: elapsedForeground
      reinsert: true
    - id: algorithms-independent-practice
      label: Independent Practice
      lengths:
        default: 20
        supported: [10, 20, 40]
      scope: declaredInterleavedScope
      shortening: blueprintControlled
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer]
      timer:
        kind: elapsedForeground
      reinsert: false
    - id: algorithms-interview-simulation
      label: Interview Simulation
      lengths:
        default: 40
        supported: [40]
      scope: fixedSimulationBlueprint
      shortening: prohibited
      feedback:
        default: atSessionEnd
        supported: [atSessionEnd]
      timer:
        kind: countdownForeground
        durationMs: 2700000
      reinsert: false
