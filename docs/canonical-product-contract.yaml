        inProgress: recoveryPending
        success: recoveryPending
        failureTransitions:
          - { failures: [invalidInput, rateLimited, offline, remoteFailure], to: signedOut }
      - id: resetPassword
        surfaceId: resetPassword
        from: [recoveryPending]
        inProgress: resettingPassword
        success: signedOut
        failureTransitions:
