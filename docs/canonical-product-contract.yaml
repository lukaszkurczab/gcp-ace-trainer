simulationOperationStateCtas:
  version: 1
  policies:
    - id: saving-response
      operationStates: [saving]
      allowedCtaIds: []
    - id: save-failed
      operationStates: [save_failed, stale_revision]
      allowedCtaIds: [simulation-save, simulation-keep-editing, simulation-leave-resumable]
    - id: response-saved-navigation-failed
      operationStates: [navigation_failed, save_and_continue_advance_recovery]
      allowedCtaIds: [simulation-navigator-jump, simulation-recover, simulation-leave-resumable]
    - id: finalizing
      operationStates: [frozen, finalization_journal_pending, materializing, verifying, verified_pending_clear]
      allowedCtaIds: []
    - id: finalization-recovery-required
      operationStates: [finalization_journal_failed, materialization_failed, verification_failed, recovery_required]
      allowedCtaIds: [simulation-finish, simulation-recover]
algorithms:
  customPractice:
    modeId: algorithms-custom-practice
    contentBlueprintModeId: algorithms-guided-practice
    mentalUnitSelection: explicit
    reinsertOwnership: profile
    lifecycle: sharedOneActiveSession
  reinsertPolicy:
    version: 1
    eligibleResultKinds: [incorrect, partial]
    maxReinsertsPerSource: 1
    minInterveningDurableSubmissions: 3
    variantSelectionOrder: [compatibleReviewedVariant, exactSourceFallback]
    missingValidSlot: skip
  modes:
    - id: algorithms-learn-approach
      label: Learn Approach
      lengths:
        default: 10
        supported: [10]
      scope: oneMentalUnit
      shortening: allowed
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer]
      timer:
        kind: elapsedForeground
      reinsert: false
    - id: algorithms-guided-practice
      label: Guided Practice
      lengths:
        default: 20
        supported: [10, 20, 40]
      scope: oneMentalUnit
      shortening: allowed
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer]
      timer:
        kind: elapsedForeground
      reinsert: true
    - id: algorithms-custom-practice
      label: Custom Practice
      lengths:
        default: 20
        supported: [10, 20, 40]
      scope: guidedPracticeBlueprintForSelectedMentalUnit
      shortening: allowed
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer, atSessionEnd]
      timer:
        kind: elapsedForeground
      reinsert: true
    - id: algorithms-recognize-patterns
      label: Recognize Patterns
      lengths:
        default: 20
        supported: [10, 20, 40]
      scope: declaredRecognitionSet
      shortening: allowed
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer]
      timer:
        kind: elapsedForeground
      reinsert: false
    - id: algorithms-contrast-practice
      label: Contrast Practice
      lengths:
        default: 20
        supported: [10, 20, 40]
      scope: declaredContrastSet
      shortening: allowed
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer]
      timer:
        kind: elapsedForeground
      reinsert: false
    - id: algorithms-weak-area-review
      label: Weak Area Review
      lengths:
        default: 10
        supported: [10, 20]
      scope: eligibleDueReviewOrCompletedSessionMisses
      shortening: allowed
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer]
      timer:
        kind: elapsedForeground
      reinsert: true
    - id: algorithms-independent-practice
      label: Independent Practice
      lengths:
        default: 20
        supported: [10, 20, 40]
      scope: declaredInterleavedScope
      shortening: blueprintControlled
      feedback:
        default: afterEachAnswer
        supported: [afterEachAnswer]
      timer:
        kind: elapsedForeground
      reinsert: false
    - id: algorithms-interview-simulation
      label: Interview Simulation
      lengths:
        default: 40
        supported: [40]
      scope: fixedSimulationBlueprint
      shortening: prohibited
      feedback:
        default: atSessionEnd
        supported: [atSessionEnd]
      timer:
        kind: countdownForeground
        durationMs: 2700000
      reinsert: false
