version: 1
contractId: patternly-product-contract
authority:
  normativeSource: canonical-product-contract
  narrativeDocuments: non-normative
requirements:
  - id: CONTRACT-AUTHORITY-001
    statement: Product behavior is normative only when defined by this contract.
  - id: ALGORITHMS-MODE-MATRIX-001
    statement: Algorithms exposes exactly the declared mode matrix, including each mode's session, scope, feedback, timer, shortening, and reinsert behavior.
  - id: ALGORITHMS-CUSTOM-PRACTICE-001
    statement: Custom Practice accepts only 10, 20, or 40 items and explicit afterEachAnswer or atSessionEnd feedback, uses the Guided Practice blueprint for an explicitly selected mental unit, and shares the one-active-session lifecycle with profile-owned reinsert.
  - id: ALGORITHMS-CUSTOM-IMMEDIATE-FEEDBACK-001
    statement: Custom Practice with afterEachAnswer journals and materializes each submitted response before exposing that item's feedback, advances only after the durable response, and finalizes one canonical session result.
  - id: ALGORITHMS-CUSTOM-DEFERRED-FEEDBACK-001
    statement: Custom Practice with atSessionEnd keeps correctness, Reason, Details, and distractor explanations unavailable after every durable per-item submission until its canonical completed result is loaded.
  - id: ALGORITHMS-CUSTOM-DEFERRED-SUMMARY-001
    statement: A completed Custom Practice atSessionEnd session reloads its complete feedback only from the durable canonical result after application relaunch.
  - id: ALGORITHMS-CUSTOM-REINSERT-OWNERSHIP-001
    statement: Custom Practice resolves its eligible and skipped conditional reinsert slots only from the profile-owned policy and rejects every learner reinsert override before session preparation.
  - id: ALGORITHMS-REINSERT-POLICY-001
    statement: Algorithms reinsert permits one eligible incorrect or partial source attempt after at least three intervening durable submissions, preferring a compatible reviewed variant then an exact-source fallback, and skips when no valid slot exists.
  - id: CERTIFICATION-MODE-MATRIX-001
    statement: Certification exposes exactly seven declared modes, each owned by the certification family and cloud-certification track with explicit contract, implementation, and verification status.
  - id: CERTIFICATION-DIAGNOSTIC-BASELINE-001
    statement: Certification Diagnostic Baseline uses its approved shared practice flow with exactly forty unique blueprint items, no selectors, shortening, or reinsert, elapsed foreground time, feedback after each durable response, and a domain breakdown summary.
  - id: CERTIFICATION-FOCUS-PRACTICE-001
    statement: Certification Focus Practice requires one explicitly selected Cloud domain, accepts only ten, twenty, or forty requested items, never fills from a sibling domain, and may shorten only within the selected domain.
  - id: USER-COMMAND-MODEL-001
    statement: Every canonical session CTA maps to exactly one declared application command; a non-final simulation CTA maps only to the atomic save-and-continue application command.
  - id: USER-COMMAND-RESUME-001
    statement: Resume is distinct from recover because a user-facing Resume CTA restores an active session, while recover replays a pending durable mutation.
  - id: SIMULATION-SAVE-AND-CONTINUE-001
    statement: The save-and-continue user action for a non-final Algorithms Interview Simulation occurrence is represented by one application command that accepts the active occurrence and a complete response.
  - id: SIMULATION-SAVE-AND-CONTINUE-VERIFICATION-001
    statement: Save-and-continue verifies the durable draft revision and persisted response before it advances exactly one occurrence and publishes the verified next simulation projection.
  - id: SIMULATION-SAVE-AND-CONTINUE-RECOVERY-001
    statement: If save-and-continue persists a response but does not verify its advance, it exposes explicit recovery that advances only from the durable response without creating another draft revision.
  - id: SIMULATION-SAVE-AND-CONTINUE-CTA-001
    statement: Every non-final Algorithms Interview Simulation response CTA is labelled Save and continue, is disabled until complete, and invokes only the save-and-continue application command.
  - id: SIMULATION-FINAL-OCCURRENCE-001
    statement: At the final Algorithms Interview Simulation occurrence, a changed complete response is saved as a durable draft before the canonical finish confirmation is exposed; an unchanged unanswered final occurrence exposes that same finish confirmation.
  - id: SIMULATION-SAVE-AND-JUMP-001
    statement: The Algorithms Interview Simulation navigator-jump command saves a changed local response as a verified durable draft before it publishes the requested occurrence; a navigator interaction never silently discards that response.
  - id: SIMULATION-RELAUNCH-001
    statement: After the first Algorithms Interview Simulation response saves and advances, a new composition root restores its durable response, second occurrence, timer checkpoint, and exactly one active session.
  - id: SIMULATION-SAVE-AND-CONTINUE-IDEMPOTENCY-001
    statement: Duplicate concurrent save-and-continue commands for the same active Algorithms Interview Simulation occurrence and response share one durable draft save and one verified advance.
  - id: SIMULATION-FULL-LIFECYCLE-001
    statement: The complete immutable forty-occurrence Algorithms Interview Simulation plan finalizes into one result with forty distinct answered occurrences and no active session or durable draft.
  - id: SIMULATION-TIMER-UI-REFRESH-001
    statement: The visible Algorithms Interview Simulation timer formats the runtime remaining-foreground projection every second without a durable write for each UI refresh.
  - id: SIMULATION-TIMER-CHECKPOINT-INTERVAL-001
    statement: Algorithms Interview Simulation periodic durable checkpoints use the declared fifteen-second interval and one-second maximum drift, producing one durable write per due interval.
  - id: SIMULATION-TIMER-BACKGROUND-CHECKPOINT-001
    statement: Leaving Algorithms Interview Simulation foreground durably checkpoints its active segment before background time begins, and background duration never reduces its countdown.
  - id: SIMULATION-TIMER-FINALIZATION-CHECKPOINT-001
    statement: Manual Algorithms Interview Simulation finalization durably checkpoints the active foreground segment before it freezes the result, so finalization observes that verified elapsed time.
  - id: SIMULATION-TIMER-MUTATION-SERIALIZATION-001
    statement: Algorithms Interview Simulation timer checkpoints, draft saves, and navigation share one mutation lane and do not overwrite a durable draft revision or current position.
  - id: SIMULATION-TIMER-FORCE-CLOSE-BOUNDARY-001
    statement: Algorithms Interview Simulation force-close immediately before and after the periodic checkpoint boundary restores only its last verified foreground time within the declared one-second drift bound.
  - id: SIMULATION-ACTIVE-SCREEN-FIDELITY-001
    statement: The approved active Algorithms Interview Simulation screen fills its viewport and presents the timer, counter, active question, save state, and leave/save actions without an inline question navigator.
  - id: SIMULATION-NAVIGATOR-FIDELITY-001
    statement: The approved Algorithms Interview Simulation question navigator exposes exactly forty positions in reading order with current, answered-and-saved, and unanswered states, adapts to four columns at larger text sizes, and labels every position without showing correctness.
  - id: SIMULATION-OPERATION-STATE-ACTIONS-001
    statement: The approved Algorithms Interview Simulation operation states render only the state and CTA actions returned by the application layer; a save failure may explicitly resume local editing only when no response was durably saved, and no generic retry is rendered.
  - id: SIMULATION-ACCESSIBILITY-001
    statement: Interactive Algorithms Interview Simulation controls provide a 48-point target, navigator errors retain their retry CTA as a separate focusable element, and the navigator removes its transition when the operating system enables Reduce Motion.
  - id: SESSION-STATE-MACHINE-001
    statement: Practice and simulation expose only their declared durable operation states and triggered transitions; recovery returns only the state declared for the recovered durable mutation.
  - id: SIMULATION-CONCURRENCY-001
    statement: "A simulation has one active session mutation lane: save, navigation, timer checkpoint, foreground transition, finalization, and abandonment are FIFO-serialized with at most one in flight, and revalidate the active session immediately before execution."
  - id: SIMULATION-TIMER-CADENCE-001
    statement: "Simulation timer projections refresh every second without a durable write; durable checkpoints occur every 15 seconds with at most one second of drift and at every declared lifecycle checkpoint."
  - id: NARRATIVE-DOCS-CANONICALIZATION-001
    statement: Narrative documents reference the canonical contract and do not maintain competing mode matrices or fixed configuration values.
  - id: DESIGN-REFERENCE-REGISTRY-001
    statement: User-facing work may be ready only when it names a registered APPROVED design reference.
