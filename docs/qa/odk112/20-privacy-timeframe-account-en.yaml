appId: com.lkurczab.patternly
name: ODK-112 GDPR timeframe before submission — account EN
tags: [ios, legal, account]
---
- launchApp:
    stopApp: true
- waitForAnimationToEnd
- tapOn:
    id: "main-tab-bar-settings"
- waitForAnimationToEnd
- tapOn:
    id: "main-tab-bar-settings"
- extendedWaitUntil:
    visible:
      id: "settings-language"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "settings-legal-information"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "settings-legal-information"
- scrollUntilVisible:
    element:
      id: "legal-request-privacy"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "legal-request-privacy"
- assertVisible:
    id: "privacy-request-create"
- assertVisible: ".*within one month.*up to two months.*within the first month.*"
- takeScreenshot: "legal__hub-boundary__080__privacy-legal-timeframe__account-en__dark__ios-regular"
- tapOn:
    id: "privacy-request-create"
- assertVisible: ".*response period starts when the request is received.*identity verification.*"
- takeScreenshot: "legal__hub-boundary__090__privacy-form-timeframe__account-en__dark__ios-regular"
