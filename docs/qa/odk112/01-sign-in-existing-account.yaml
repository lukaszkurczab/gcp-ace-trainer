appId: com.lkurczab.patternly
name: ODK-112 sign in existing QA account
tags: [ios, legal, setup]
---
- launchApp:
    stopApp: true
- waitForAnimationToEnd
- tapOn:
    id: "main-tab-bar-settings"
- waitForAnimationToEnd
- tapOn:
    id: "main-tab-bar-settings"
- extendedWaitUntil:
    visible:
      id: "settings-language"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "settings-account-entry"
    direction: UP
    centerElement: true
- tapOn:
    id: "settings-account-entry"
- tapOn:
    id: "account-email"
- inputText: "odk108-runtime-20260912@example.test"
- tapOn:
    id: "account-password"
- inputText: "Odk108Secure42"
- tapOn:
    point: "50%,20%"
- tapOn:
    id: "account-sign-in-submit"
- extendedWaitUntil:
    visible:
      id: "account-entry-continue"
    timeout: 30000
- tapOn:
    id: "account-entry-continue"
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-settings"
    timeout: 120000
