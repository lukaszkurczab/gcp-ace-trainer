appId: com.lkurczab.patternly
name: ODK-112 dismiss password prompt and continue account
tags: [ios, legal, setup]
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,64%"
- tapOn:
    id: "account-entry-continue"
- extendedWaitUntil:
    visible:
      id: "account-open-settings"
    timeout: 120000
- tapOn:
    id: "account-open-settings"
- runFlow:
    when:
      visible: "Start track"
    commands:
      - tapOn: "Start track"
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-settings"
    timeout: 120000
