appId: com.lkurczab.patternly
name: ODK-111 personal rights and non-personal recovery — account EN
tags: [ios, legal, account]
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: "Terms of Service"
    commands:
      - tapOn: "Go back"
- runFlow:
    when:
      visible: "Privacy requests"
    commands:
      - tapOn: "Go back"
- runFlow:
    when:
      visible:
        id: "main-tab-bar-settings"
    commands:
      - tapOn:
          id: "main-tab-bar-settings"
      - scrollUntilVisible:
          element:
            id: "settings-legal-information"
          direction: DOWN
      - tapOn:
          id: "settings-legal-information"
- scrollUntilVisible:
    element:
      id: "legal-request-data-recovery"
    direction: DOWN
    centerElement: true
- assertVisible: ".*GDPR requests.*privacy-right request.*"
- assertVisible: ".*Recover non-personal data.*Deleted progress is not retained or restored.*"
- takeScreenshot: "legal__data-routes__010__separate-rows__account-en__dark__ios-regular"
- tapOn:
    id: "legal-request-privacy"
- assertVisible: "Privacy requests"
- assertVisible:
    id: "privacy-request-create"
- takeScreenshot: "legal__data-routes__020__privacy-account-route__account-en__dark__ios-regular"
- tapOn: "Go back"
- scrollUntilVisible:
    element:
      id: "legal-request-data-recovery"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "legal-request-data-recovery"
- assertVisible: "Recover non-personal data"
- assertVisible: ".*eligible non-personal data.*Deleted progress is not retained or restored.*"
- assertVisible:
    id: "legal-request-create-data_recovery"
- tapOn:
    id: "legal-request-create-data_recovery"
- assertVisible:
    id: "legal-request-narrative"
- assertNotVisible:
    id: "legal-request-email"
- takeScreenshot: "legal__data-routes__030__recovery-account-form__account-en__dark__ios-regular"
