appId: com.lkurczab.patternly
name: ODK-108 fresh local account bootstrap
tags: [ios, account, setup]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Remove unavailable data"
    timeout: 120000
- tapOn: "Remove unavailable data"
- tapOn: "Remove data from device"
- extendedWaitUntil:
    visible:
      id: "account-register"
    timeout: 120000
- tapOn:
    id: "account-register"
- tapOn:
    id: "account-register-terms-checkbox"
- tapOn:
    id: "account-email"
- inputText: "odk108-local-20260912@example.test"
- tapOn:
    id: "account-password"
- inputText: "Odk108Secure42"
- tapOn:
    id: "account-password-confirmation"
- inputText: "Odk108Secure42"
- tapOn:
    point: "50%,20%"
- tapOn:
    id: "account-register-submit"
- extendedWaitUntil:
    visible:
      id: "account-entry-continue"
    timeout: 30000
- tapOn:
    id: "account-entry-continue"
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-settings"
    timeout: 120000
