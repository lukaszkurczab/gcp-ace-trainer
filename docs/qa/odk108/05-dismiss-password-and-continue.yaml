appId: com.lkurczab.patternly
name: ODK-108 dismiss iOS password prompt and continue
tags: [ios, account, setup]
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,64%"
- tapOn:
    id: "account-entry-continue"
- extendedWaitUntil:
    visible: "Start track"
    timeout: 120000
- tapOn: "Start track"
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-settings"
    timeout: 120000
