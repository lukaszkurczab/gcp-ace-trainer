appId: com.lkurczab.patternly
name: ODK-108 reauthenticate and open share sheet — EN
tags: [ios, account, export, security]
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "security-password"
    timeout: 30000
- tapOn:
    id: "security-password"
- inputText: "Odk108CleanSecure42"
- tapOn:
    point: "50%,20%"
- tapOn:
    id: "security-submit"
- extendedWaitUntil:
    visible:
      id: "account-data-export"
    timeout: 30000
- tapOn:
    id: "account-data-export"
- waitForAnimationToEnd
- takeScreenshot: "export__auth__030__system-share-sheet__en__light__ios-regular"
