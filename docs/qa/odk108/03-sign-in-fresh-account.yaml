appId: com.lkurczab.patternly
name: ODK-108 sign in fresh recent-auth account
---
- tapOn:
    id: "account-sign-in"
- tapOn:
    id: "account-email"
- inputText: "odk108-runtime-20260912@example.test"
- tapOn:
    id: "account-password"
- inputText: "Odk108Secure42"
- tapOn:
    point: "50%,20%"
- tapOn:
    id: "account-sign-in-submit"
- extendedWaitUntil:
    visible:
      id: "account-entry-continue"
    timeout: 30000
- tapOn:
    id: "account-entry-continue"
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-settings"
    timeout: 120000
