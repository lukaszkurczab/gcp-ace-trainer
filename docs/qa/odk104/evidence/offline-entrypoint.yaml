appId: com.lkurczab.patternly
---
- tapOn:
    id: "account-data-export"
- extendedWaitUntil:
    visible:
      id: "account-data-export-offline"
    timeout: 30000
- assertVisible: "Nie\\ udało\\ się\\ dokończyć,\\ Brak\\ połączenia\\.\\ Sprawdź\\ sieć\\ i\\ spróbuj\\ ponownie\\."
- takeScreenshot: "data__auth__offline-export__pl"
- tapOn:
    id: "privacy-requests-entry"
- extendedWaitUntil:
    visible: "Nie\\ udało\\ się\\ wykonać\\ działania,\\ Brak\\ połączenia\\.\\ Sprawdź\\ sieć\\ i\\ spróbuj\\ ponownie\\."
    timeout: 30000
- takeScreenshot: "data__auth__offline-privacy-list__pl"
- tapOn: "Wróć"
- tapOn: "Wróć"
- scrollUntilVisible:
    element:
      id: "settings-language"
    direction: UP
    centerElement: true
- tapOn:
    id: "settings-language"
- tapOn:
    id: "language-option-en"
- tapOn: "Go back"
- scrollUntilVisible:
    element:
      id: "settings-your-data"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "settings-your-data"
- tapOn:
    id: "account-data-export"
- extendedWaitUntil:
    visible:
      id: "account-data-export-offline"
    timeout: 30000
- assertVisible: "Could\\ not\\ complete\\ the\\ action,\\ You\\ appear\\ to\\ be\\ offline\\.\\ Check\\ your\\ connection\\ and\\ try\\ again\\."
- takeScreenshot: "data__auth__offline-export__en"
- tapOn:
    id: "privacy-requests-entry"
- extendedWaitUntil:
    visible: "Could\\ not\\ complete\\ the\\ action,\\ You\\ appear\\ to\\ be\\ offline\\.\\ Check\\ your\\ connection\\ and\\ try\\ again\\."
    timeout: 30000
- takeScreenshot: "data__auth__offline-privacy-list__en"
- tapOn: "Go back"
- tapOn: "Go back"
