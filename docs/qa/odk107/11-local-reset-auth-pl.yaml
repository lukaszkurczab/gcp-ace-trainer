appId: com.lkurczab.patternly
name: ODK-107 local reset — authenticated PL
tags: [ios, account, i18n, destructive]
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible:
        id: "settings-bottom-sheet-close"
    commands:
      - tapOn:
          id: "settings-bottom-sheet-close"
- runFlow:
    when:
      visible: "Go back"
    commands:
      - tapOn: "Go back"
- runFlow:
    when:
      visible: "Twoje dane"
    commands:
      - tapOn:
          point: "10%,12%"
- runFlow:
    when:
      visible: "Your data"
    commands:
      - tapOn:
          point: "10%,12%"
- runFlow:
    when:
      visible: "Check verification"
    commands:
      - tapOn: "Check verification"
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-settings"
    timeout: 120000
- tapOn:
    id: "main-tab-bar-settings"
- tapOn:
    id: "main-tab-bar-settings"
- scrollUntilVisible:
    element:
      id: "settings-language"
    direction: UP
    centerElement: true
- tapOn:
    id: "settings-language"
- tapOn:
    id: "language-option-pl"
- tapOn: "Wróć"
- tapOn:
    id: "main-tab-bar-settings"
- scrollUntilVisible:
    element:
      id: "settings-your-data"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "settings-your-data"
- scrollUntilVisible:
    element:
      id: "data-local-reset"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "data-local-reset"
- assertVisible: ".*kopia w chmurze nigdy nie jest usuwana.*"
- takeScreenshot: "local-reset__auth__010__scope__pl__dark__ios-regular"
- scrollUntilVisible:
    element:
      id: "data-local-reset-cancel"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "data-local-reset-cancel"
- assertVisible:
    id: "data-local-reset"
- tapOn:
    id: "data-local-reset"
- scrollUntilVisible:
    element:
      id: "data-local-reset-confirm"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "data-local-reset-confirm"
- extendedWaitUntil:
    visible:
      id: "data-local-reset-success"
    timeout: 30000
- takeScreenshot: "local-reset__auth__020__success__pl__dark__ios-regular"
