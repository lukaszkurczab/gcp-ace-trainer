appId: com.lkurczab.patternly
name: ODK-107 local reset — guest EN and PL
tags: [ios, guest, i18n, destructive]
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible:
        id: "onboarding-not-now"
    commands:
      - tapOn:
          id: "onboarding-not-now"
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-settings"
    timeout: 120000
- tapOn:
    id: "main-tab-bar-settings"
- tapOn:
    id: "main-tab-bar-settings"
- scrollUntilVisible:
    element:
      id: "settings-language"
    direction: UP
    centerElement: true
- tapOn:
    id: "settings-language"
- tapOn:
    id: "language-option-en"
- tapOn: "Go back"
- tapOn:
    id: "main-tab-bar-settings"
- scrollUntilVisible:
    element:
      id: "settings-your-data"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "settings-your-data"
- scrollUntilVisible:
    element:
      id: "data-local-reset"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "data-local-reset"
- assertVisible:
    id: "data-local-reset-scope"
- assertVisible:
    id: "data-local-reset-confirmation"
- takeScreenshot: "local-reset__guest__010__scope__en__light__ios-regular"
- scrollUntilVisible:
    element:
      id: "data-local-reset-cancel"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "data-local-reset-cancel"
- assertVisible:
    id: "data-local-reset"
- tapOn:
    id: "data-local-reset"
- scrollUntilVisible:
    element:
      id: "data-local-reset-confirm"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "data-local-reset-confirm"
- extendedWaitUntil:
    visible:
      id: "data-local-reset-success"
    timeout: 30000
- takeScreenshot: "local-reset__guest__020__success__en__light__ios-regular"
- tapOn:
    id: "data-local-reset-cancel"
- tapOn: "Go back"
- scrollUntilVisible:
    element:
      id: "settings-language"
    direction: UP
    centerElement: true
- tapOn:
    id: "settings-language"
- tapOn:
    id: "language-option-pl"
- tapOn: "Wróć"
- tapOn:
    id: "main-tab-bar-settings"
- scrollUntilVisible:
    element:
      id: "settings-your-data"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "settings-your-data"
- scrollUntilVisible:
    element:
      id: "data-local-reset"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "data-local-reset"
- assertVisible: "Co zostanie zresetowane"
- assertVisible: ".*Aktywna ścieżka, cele, plany, preferencje, powiadomienia.*pozostaną.*"
- takeScreenshot: "local-reset__guest__030__scope__pl__light__ios-regular"
- scrollUntilVisible:
    element:
      id: "data-local-reset-cancel"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "data-local-reset-cancel"
- tapOn:
    id: "data-local-reset"
- scrollUntilVisible:
    element:
      id: "data-local-reset-confirm"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "data-local-reset-confirm"
- extendedWaitUntil:
    visible:
      id: "data-local-reset-success"
    timeout: 30000
- takeScreenshot: "local-reset__guest__040__success__pl__light__ios-regular"
