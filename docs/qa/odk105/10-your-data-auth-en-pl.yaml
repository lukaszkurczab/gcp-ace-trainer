appId: com.lkurczab.patternly
name: ODK-105 Your data truth — authenticated EN and PL
tags:
  - screenshot
  - ios
  - i18n
  - account
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: "Check verification"
    commands:
      - tapOn: "Check verification"
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-settings"
    timeout: 120000
- tapOn:
    id: "main-tab-bar-settings"
- tapOn:
    id: "main-tab-bar-settings"
- scrollUntilVisible:
    element:
      id: "settings-language"
    direction: UP
    centerElement: true
- tapOn:
    id: "settings-language"
- tapOn:
    id: "language-option-en"
- tapOn: "Go back"
- tapOn:
    id: "main-tab-bar-settings"
- scrollUntilVisible:
    element:
      id: "settings-your-data"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "settings-your-data"
- assertVisible: ".*Supported account records can also sync to your account cloud.*"
- takeScreenshot: "data-truth__auth__010__summary__en__dark__ios-regular"
- tapOn:
    id: "account-data-export-details"
- assertVisible: "Data details"
- assertVisible: ".*normal sync can restore supported records from the account cloud.*"
- assertVisible: ".*Guest-data adoption is a separate choice.*"
- assertVisible: ".*downloaded JSON is for access and portability and cannot be imported into Patternly.*"
- takeScreenshot: "data-truth__auth__020__details-restore__en__dark__ios-regular"
- scrollUntilVisible:
    element: "Close"
    direction: UP
    centerElement: true
- tapOn: "Close"
- tapOn: "Go back"
- scrollUntilVisible:
    element:
      id: "settings-language"
    direction: UP
    centerElement: true
- tapOn:
    id: "settings-language"
- tapOn:
    id: "language-option-pl"
- tapOn: "Wróć"
- tapOn:
    id: "main-tab-bar-settings"
- scrollUntilVisible:
    element:
      id: "settings-your-data"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "settings-your-data"
- assertVisible: ".*Obsługiwane rekordy konta mogą być także synchronizowane z chmurą konta.*"
- takeScreenshot: "data-truth__auth__030__summary__pl__dark__ios-regular"
- tapOn:
    id: "account-data-export-details"
- assertVisible: "Szczegóły danych"
- assertVisible: ".*zwykła synchronizacja może przywrócić obsługiwane rekordy z chmury konta.*"
- assertVisible: ".*Adopcja danych gościa jest osobną decyzją.*"
- assertVisible: ".*Pobrany plik JSON służy dostępowi i przenoszeniu danych i nie można go zaimportować do Patternly.*"
- takeScreenshot: "data-truth__auth__040__details-restore__pl__dark__ios-regular"
