appId: com.lkurczab.patternly
name: ODK-126 report affordance runtime evidence
---
- tapOn:
    id: "patternly:session:details-toggle:CCARP-D01-O01-boundary"
- scrollUntilVisible:
    element:
      text: "Report an issue"
    direction: DOWN
    centerElement: true
- assertVisible: "Report an issue"
- takeScreenshot: docs/qa/evidence/ODK-126/report-affordance-light
- tapOn: "Report an issue"
- assertVisible: "Report a content issue"
- assertVisible: "Send report"
- assertNotVisible: "Report accepted. Thank you."
- takeScreenshot: docs/qa/evidence/ODK-126/report-form-open-no-submit
- scrollUntilVisible:
    element:
      text: "Cancel"
    direction: DOWN
    centerElement: true
- tapOn: "Cancel"
- assertNotVisible: "Report a content issue"
