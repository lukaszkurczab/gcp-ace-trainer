appId: com.lkurczab.patternly
name: BIZQ-02 minutes09 save once then actual existing-plan reload
---
- assertVisible:
    id: patternly:learning-plan:editor:time:mon
    text: '09:15'
- tapOn:
    id: patternly:learning-plan:editor:commit
- extendedWaitUntil:
    visible:
      id: patternly:learning-plan:persisted
    timeout: 30000
- assertVisible: '09:15'
- takeScreenshot: bizq02-minutes09-saved
- tapOn:
    id: patternly:learning-plan:edit-schedule
- extendedWaitUntil:
    visible:
      id: patternly:learning-plan:editor:commit
    timeout: 30000
- scrollUntilVisible:
    element:
      id: patternly:learning-plan:editor:time:mon
    direction: DOWN
    centerElement: true
- assertVisible:
    id: patternly:learning-plan:editor:time:mon
    text: '09:15'
- takeScreenshot: bizq02-minutes09-existing-plan-reloaded
