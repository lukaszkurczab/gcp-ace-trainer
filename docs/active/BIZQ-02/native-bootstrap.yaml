appId: com.lkurczab.patternly
name: BIZQ-02 existing iPhone guest bootstrap
---
- launchApp:
    clearState: false
- openLink: "com.lkurczab.patternly://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- runFlow:
    when:
      visible: "Open|Otwórz"
    commands:
      - tapOn: "Open|Otwórz"
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 45000
- tapOn:
    id: main-tab-bar-home
- takeScreenshot: bizq02-home-baseline
