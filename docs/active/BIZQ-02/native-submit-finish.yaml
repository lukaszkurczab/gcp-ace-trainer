appId: com.lkurczab.patternly
name: BIZQ-02 finish post-submit navigation with explicit screen fences
---
- tapOn:
    id: main-tab-bar-home
- assertVisible:
    id: patternly:home:track-card:google-cloud-associate-cloud-engineer
- tapOn:
    id: main-tab-bar-progress
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: patternly:progress:root
    timeout: 30000
- scrollUntilVisible:
    element:
      id: patternly:progress:goal
    direction: DOWN
    centerElement: true
- tapOn:
    id: patternly:progress:goal
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: patternly:goal:root
    timeout: 30000
- scrollUntilVisible:
    element:
      id: patternly:learning-plan:create
    direction: DOWN
- tapOn:
    id: patternly:learning-plan:create
- extendedWaitUntil:
    visible:
      id: patternly:learning-plan:accept
    timeout: 30000
- takeScreenshot: bizq02-proposal-after-real-submit
- stopApp
- launchApp:
    clearState: false
- openLink: "com.lkurczab.patternly://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 30000
- tapOn:
    id: main-tab-bar-progress
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: patternly:progress:root
    timeout: 30000
- scrollUntilVisible:
    element:
      id: patternly:target-date-guidance:state:progress:open-ended
    direction: DOWN
- assertVisible:
    id: patternly:progress-plan:completion:unknown
- takeScreenshot: bizq02-post-submit-restart
- tapOn:
    id: main-tab-bar-home
- stopApp
