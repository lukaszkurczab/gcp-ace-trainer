appId: com.lkurczab.patternly
name: PROFILE-06/E dismissal persists across restart
---
- runFlow:
    when:
      visible:
        id: "patternly:learning-plan:root"
    commands:
      - tapOn: "Go back"
- assertVisible:
    id: "patternly:home:learning-plan-recovery:dismiss"
- tapOn:
    id: "patternly:home:learning-plan-recovery:dismiss"
- assertNotVisible:
    id: "patternly:home:learning-plan-recovery"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- assertNotVisible:
    id: "patternly:home:learning-plan-recovery"
- takeScreenshot:
    path: profile06-e-dismissed-after-restart
