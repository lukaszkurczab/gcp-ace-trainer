appId: com.lkurczab.patternly
name: PROFILE-06/E opens Home with preserved state and recovery notice
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- assertVisible:
    id: "patternly:home:learning-plan-recovery"
- assertVisible:
    id: "patternly:home:learning-plan-recovery:create"
- assertVisible:
    id: "patternly:home:learning-plan-recovery:dismiss"
- assertVisible: "1 answered"
- takeScreenshot:
    path: profile06-e-recovery-visible
