appId: com.lkurczab.patternly
name: PROFILE-06/E recovery action opens plan proposal
---
- tapOn:
    id: "main-tab-bar-home"
- extendedWaitUntil:
    visible:
      id: "patternly:home:learning-plan-recovery:create"
    timeout: 30000
- tapOn:
    id: "patternly:home:learning-plan-recovery:create"
- extendedWaitUntil:
    visible:
      id: "patternly:learning-plan:root"
    timeout: 30000
- assertVisible:
    id: "patternly:learning-plan:state:ready"
- assertVisible:
    id: "patternly:learning-plan:accept"
- takeScreenshot:
    path: profile06-e-create-plan-proposal
