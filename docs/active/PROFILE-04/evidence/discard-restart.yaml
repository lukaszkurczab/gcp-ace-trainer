appId: com.lkurczab.patternly
name: PROFILE-04 discard choice survives restart and completes
tags:
  - e2e
  - profile
  - account
---
- assertVisible:
    id: "account-entry-choice"
- assertVisible:
    id: "account-keep-progress-toggle"
    checked: false
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "account-entry-choice"
    timeout: 30000
- assertVisible:
    id: "account-keep-progress-toggle"
    checked: false
- tapOn:
    id: "account-entry-continue"
- extendedWaitUntil:
    visible: "Remove device data"
    timeout: 10000
- tapOn: "Remove device data"
- extendedWaitUntil:
    visible:
      id: "patternly:content:ready"
    timeout: 30000
- assertNotVisible:
    id: "account-entry-choice"
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "patternly:content:ready"
    timeout: 30000
- assertNotVisible:
    id: "account-entry-choice"
