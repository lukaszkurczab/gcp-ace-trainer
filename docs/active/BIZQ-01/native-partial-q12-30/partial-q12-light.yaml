appId: com.lkurczab.patternly
name: BIZQ01 Q12 light max-text existing Claude partial review
---
- stopApp
- launchApp:
    clearState: false
- openLink: "com.lkurczab.patternly://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- runFlow:
    when:
      visible: "Open|Otwórz"
    commands:
      - tapOn: "Open|Otwórz"
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 45000
- assertVisible:
    id: patternly:home:track-card:google-cloud-associate-cloud-engineer
- takeScreenshot: q12-light-max-gcp-home
- scrollUntilVisible:
    element:
      id: patternly:home:activity
    direction: DOWN
    centerElement: false
- tapOn:
    id: patternly:home:activity
- extendedWaitUntil:
    visible:
      id: patternly:activity:root
    timeout: 15000
- scrollUntilVisible:
    element:
      id: patternly:activity:row:claude-certified-architect-professional-certification:certification-focus-practice:2
    direction: DOWN
    centerElement: false
- tapOn:
    id: patternly:activity:row:claude-certified-architect-professional-certification:certification-focus-practice:2
- extendedWaitUntil:
    visible:
      id: patternly:summary:root:claude-certified-architect-professional-certification:certification-focus-practice:2
    timeout: 15000
- scrollUntilVisible:
    element: "Session complete"
    direction: UP
    centerElement: false
- scrollUntilVisible:
    element:
      id: patternly:summary:review-answers:claude-certified-architect-professional-certification:certification-focus-practice:2
    direction: DOWN
    centerElement: false
- tapOn:
    id: patternly:summary:review-answers:claude-certified-architect-professional-certification:certification-focus-practice:2
- extendedWaitUntil:
    visible:
      id: patternly:practice-review:root:claude-certified-architect-professional-certification:certification-focus-practice:2:.*
    timeout: 15000
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- tapOn:
    id: patternly:practice-review:next
- extendedWaitUntil:
    visible:
      id: patternly:session:question:CCARP-D01-O06-selection
    timeout: 15000
- tapOn:
    id: patternly:practice-review:next
- extendedWaitUntil:
    visible:
      id: patternly:session:question:CCARP-D01-O01-transfer
    timeout: 15000
- takeScreenshot: q12-light-max-partial-question
- scrollUntilVisible:
    element: "Partly correct"
    direction: DOWN
- assertVisible: "Partly correct"
- takeScreenshot: q12-light-max-partial-result-label
- scrollUntilVisible:
    element:
      id: patternly:session:option:CCARP-D01-O01-transfer:a
    direction: DOWN
    centerElement: false
- takeScreenshot: q12-light-max-option-a-body
- scrollUntilVisible:
    element:
      id: patternly:session:option:CCARP-D01-O01-transfer:b
    direction: DOWN
    centerElement: false
- takeScreenshot: q12-light-max-selected-option-b
- scrollUntilVisible:
    element:
      id: patternly:session:option:CCARP-D01-O01-transfer:d
    direction: DOWN
    centerElement: false
- takeScreenshot: q12-light-max-omitted-correct-option-d
- scrollUntilVisible:
    element:
      id: patternly:session:result:CCARP-D01-O01-transfer:partial
    direction: DOWN
    centerElement: false
- takeScreenshot: q12-light-max-partial-reason
- swipe:
    start: 50%, 68%
    end: 50%, 35%
    duration: 450
- swipe:
    start: 50%, 68%
    end: 50%, 35%
    duration: 450
- swipe:
    start: 50%, 68%
    end: 50%, 35%
    duration: 450
