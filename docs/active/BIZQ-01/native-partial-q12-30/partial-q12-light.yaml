    visibilityPercentage: 100
    centerElement: false
    timeout: 60000
- takeScreenshot: q12-light-max-details-collapsed
- swipe:
    start: 50%, 70%
    end: 50%, 40%
    duration: 450
- takeScreenshot: q12-light-max-disclosure-reachable-reason-end
- tapOn:
    id: patternly:session:details-toggle:CCARP-D01-O01-transfer
- assertVisible: "Hide answer details"
- swipe:
    start: 50%, 68%
    end: 50%, 35%
    duration: 450
- scrollUntilVisible:
    element: "Without d, the system role and supervisor boundary remain ambiguous, so the proposed value cannot be delivered safely."
    direction: DOWN
    visibilityPercentage: 20
    centerElement: false
