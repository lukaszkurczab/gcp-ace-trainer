appId: com.lkurczab.patternly
name: BIZQ33 ordinary owned-account sign-out and original Guest return
---
- assertVisible:
    id: main-tab-bar-settings
- tapOn:
    id: main-tab-bar-settings
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: settings-sign-out
    direction: DOWN
    timeout: 30000
- tapOn:
    id: settings-sign-out
- extendedWaitUntil:
    notVisible:
      id: settings-screen
    timeout: 60000
- runFlow:
    when:
      visible:
        id: account-sign-in-guest
    commands:
      - tapOn:
          id: account-sign-in-guest
- runFlow:
    when:
      visible:
        id: account-guest
    commands:
      - tapOn:
          id: account-guest
- extendedWaitUntil:
    visible:
      id: patternly:home:track-card:google-cloud-associate-cloud-engineer
    timeout: 60000
- takeScreenshot: original-guest-home
