- tapOn:
    id: patternly:home:primary-action
- extendedWaitUntil:
    visible:
      id: patternly:practice:hub:root
    timeout: 30000
- tapOn:
    id: patternly:practice:mode-card:design-interview-learn-framework
- extendedWaitUntil:
    visible:
      id: patternly:practice:setup:root
    timeout: 30000
- assertNotVisible:
    id: premium-offer-summary
- tapOn:
    id: patternly:practice:session-length:1
- tapOn:
    id: patternly:practice:start-session
- extendedWaitUntil:
    visible:
      id: patternly:session:question:.*
    timeout: 30000
- takeScreenshot: q13-old-unanswered-item
