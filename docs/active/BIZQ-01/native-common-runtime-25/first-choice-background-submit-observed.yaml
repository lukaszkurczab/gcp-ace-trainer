    id: patternly:session:option:gcp-ace-gcpace-n01-b03-001:d
- assertVisible:
    id: patternly:session:option:gcp-ace-gcpace-n01-b03-001:d
    text: 'radio button, checked, Selected'
- assertNotVisible:
    id: patternly:session:reason:.*
- assertNotVisible:
    id: patternly:session:details:.*
- assertNotVisible:
    id: patternly:session:feedback:.*
- takeScreenshot: native25-wrong-stable-id-selected-before-background
- pressKey: Home
- launchApp:
    clearState: false
    stopApp: false
- extendedWaitUntil:
