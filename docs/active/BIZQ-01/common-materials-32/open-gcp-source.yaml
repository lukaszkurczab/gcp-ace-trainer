appId: com.lkurczab.patternly
name: BIZQ01 saved GCP source actual opening
---
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 45000
- assertVisible:
    id: patternly:home:track-card:google-cloud-associate-cloud-engineer
- takeScreenshot: gcp32-home-before
- scrollUntilVisible:
    element:
      id: patternly:home:activity
    direction: DOWN
    centerElement: false
- tapOn:
    id: patternly:home:activity
- extendedWaitUntil:
    visible:
      id: patternly:activity:root
    timeout: 15000
- scrollUntilVisible:
    element:
      id: patternly:activity:row:google-cloud-associate-cloud-engineer:certification-focus-practice:2
    direction: DOWN
    centerElement: false
- tapOn:
    id: patternly:activity:row:google-cloud-associate-cloud-engineer:certification-focus-practice:2
- extendedWaitUntil:
    visible:
      id: patternly:summary:root:google-cloud-associate-cloud-engineer:certification-focus-practice:2
    timeout: 15000
- scrollUntilVisible:
    element: 'Session complete'
    direction: UP
    centerElement: false
- takeScreenshot: gcp32-summary-before
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- assertVisible:
    id: patternly:summary:root:google-cloud-associate-cloud-engineer:certification-focus-practice:2
- scrollUntilVisible:
    element: 'Session complete'
    direction: UP
    centerElement: false
- scrollUntilVisible:
    element:
      id: patternly:summary:review-answers:google-cloud-associate-cloud-engineer:certification-focus-practice:2
    direction: DOWN
    centerElement: false
- tapOn:
    id: patternly:summary:review-answers:google-cloud-associate-cloud-engineer:certification-focus-practice:2
- extendedWaitUntil:
    visible:
      id: patternly:practice-review:root:google-cloud-associate-cloud-engineer:certification-focus-practice:2:.*
    timeout: 15000
- scrollUntilVisible:
    element:
      id: patternly:session:question:gcp-ace-gcpace-n01-b03-001
    direction: UP
    visibilityPercentage: 20
    centerElement: false
- takeScreenshot: gcp32-question
- scrollUntilVisible:
    element:
      id: patternly:session:option:gcp-ace-gcpace-n01-b03-001:a
    direction: DOWN
    centerElement: false
- takeScreenshot: gcp32-option-a
- scrollUntilVisible:
    element:
      id: patternly:session:option:gcp-ace-gcpace-n01-b03-001:d
    direction: DOWN
    centerElement: false
- takeScreenshot: gcp32-selected-wrong-option
- scrollUntilVisible:
    element:
      id: patternly:session:details-toggle:gcp-ace-gcpace-n01-b03-001
    direction: DOWN
    centerElement: false
- swipe:
    start: 50%,65%
    end: 50%,45%
    duration: 500
- runFlow:
    when:
      notVisible: Hide answer details
    commands:
      - tapOn:
          id: patternly:session:details-toggle:gcp-ace-gcpace-n01-b03-001
- assertVisible: 'Hide answer details'
- scrollUntilVisible:
    element: 'This option selects at the billing account, but the decisive requirement is organization-wide attachment scope.'
    direction: DOWN
    centerElement: false
- takeScreenshot: gcp32-authored-diagnostic
- swipe:
    start: 50%,72%
    end: 50%,47%
    duration: 500
- takeScreenshot: gcp32-details-body-1
- swipe:
    start: 50%,72%
    end: 50%,47%
    duration: 500
- takeScreenshot: gcp32-details-body-2
- swipe:
    start: 50%,72%
    end: 50%,47%
    duration: 500
- takeScreenshot: gcp32-details-body-3
- swipe:
    start: 50%,72%
    end: 50%,47%
    duration: 500
- takeScreenshot: gcp32-details-body-4
- scrollUntilVisible:
    element:
      id: question-source-link-gcp-ace-gcpace-n01-b03-001-0
    direction: DOWN
    centerElement: false
- assertVisible:
    id: patternly:practice-review:next
- takeScreenshot: gcp32-details-source-actions
- tapOn:
    id: question-source-link-gcp-ace-gcpace-n01-b03-001-0
