appId: com.lkurczab.patternly
name: BIZQ01 ordinary return and saved review continuation
---
- assertVisible:
    id: patternly:practice-review:root:google-cloud-associate-cloud-engineer:certification-focus-practice:2:.*
- takeScreenshot: gcp32-returned-same-q1-source
- scrollUntilVisible:
    element:
      id: patternly:practice-review:next
    direction: DOWN
    centerElement: false
- tapOn:
    id: patternly:practice-review:next
- assertVisible: 'Question 2 / 10'
- takeScreenshot: gcp32-saved-next-q2
- tapOn:
    id: patternly:practice-review:result
- extendedWaitUntil:
    visible:
      id: patternly:summary:root:google-cloud-associate-cloud-engineer:certification-focus-practice:2
    timeout: 15000
- scrollUntilVisible:
    element: Session complete
    direction: UP
    centerElement: false
- takeScreenshot: gcp32-summary-after
- scrollUntilVisible:
    element:
      id: patternly:summary:back-to-practice:google-cloud-associate-cloud-engineer:certification-focus-practice:2
    direction: DOWN
    centerElement: false
- tapOn:
    id: patternly:summary:back-to-practice:google-cloud-associate-cloud-engineer:certification-focus-practice:2
- tapOn:
    id: main-tab-bar-home
- assertVisible:
    id: patternly:home:track-card:google-cloud-associate-cloud-engineer
- takeScreenshot: gcp32-home-after
