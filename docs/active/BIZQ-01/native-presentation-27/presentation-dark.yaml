    centerElement: false
- takeScreenshot: native27-dark-large-authored-diagnostic
- swipe:
    start: 50%,72%
    end: 50%,47%
    duration: 500
- takeScreenshot: native27-dark-large-details-body-1
- swipe:
    start: 50%,72%
    end: 50%,47%
    duration: 500
- takeScreenshot: native27-dark-large-details-body-2
- swipe:
    start: 50%,72%
    end: 50%,47%
    duration: 500
- takeScreenshot: native27-dark-large-details-body-3
- swipe:
    start: 50%,72%
    end: 50%,47%
    duration: 500
- takeScreenshot: native27-dark-large-details-body-4
- scrollUntilVisible:
    element:
      id: question-source-link-gcp-ace-gcpace-n01-b03-001-0
