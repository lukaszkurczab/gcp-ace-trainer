    centerElement: false
- assertVisible:
    id: patternly:practice-review:next
- takeScreenshot: native27-dark-large-details-source-actions
- tapOn:
    id: patternly:practice-review:next
- extendedWaitUntil:
    visible:
      id: patternly:session:question:gcp-ace-gcpace-n01-b04-001
    timeout: 15000
- scrollUntilVisible:
    element:
      id: patternly:session:details-toggle:gcp-ace-gcpace-n01-b04-001
