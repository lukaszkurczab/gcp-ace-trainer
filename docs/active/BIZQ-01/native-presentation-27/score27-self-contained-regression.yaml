appId: com.lkurczab.patternly
name: BIZQ01 score27 self-contained readonly historical result
---
- stopApp
- launchApp:
    clearState: false
- openLink: "com.lkurczab.patternly://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- runFlow:
    when:
      visible: "Open|Otwórz"
    commands:
      - tapOn: "Open|Otwórz"
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 45000
- assertVisible:
    id: patternly:home:track-card:google-cloud-associate-cloud-engineer
- takeScreenshot: score27-corrected-cold-same-gcp-home
- assertVisible:
    id: patternly:home:activity
- tapOn:
    id: patternly:home:activity
- extendedWaitUntil:
    visible:
      id: patternly:activity:root
    timeout: 15000
- assertVisible:
    id: patternly:activity:row:google-cloud-associate-cloud-engineer:certification-focus-practice:2
- tapOn:
    id: patternly:activity:row:google-cloud-associate-cloud-engineer:certification-focus-practice:2
- extendedWaitUntil:
    visible:
      id: patternly:summary:root:google-cloud-associate-cloud-engineer:certification-focus-practice:2
    timeout: 15000
- assertVisible: 'Session complete'
- assertVisible: '10 / 10'
- takeScreenshot: score27-corrected-own-result-before-review
- tapOn:
    id: patternly:summary:review-answers:google-cloud-associate-cloud-engineer:certification-focus-practice:2
- extendedWaitUntil:
    visible:
      id: patternly:practice-review:root:google-cloud-associate-cloud-engineer:certification-focus-practice:2:.*
    timeout: 15000
- assertVisible:
    id: patternly:session:question:gcp-ace-gcpace-n01-b03-001
- assertVisible: 'Incorrect'
- takeScreenshot: score27-corrected-own-wrong-review
- assertVisible:
    id: patternly:practice-review:root:google-cloud-associate-cloud-engineer:certification-focus-practice:2:.*
- assertVisible:
    id: patternly:session:question:gcp-ace-gcpace-n01-b03-001
- swipe:
    start: 50%,72%
    end: 50%,50%
    duration: 500
- assertVisible:
    id: patternly:session:details-toggle:gcp-ace-gcpace-n01-b03-001
- tapOn:
    id: patternly:session:details-toggle:gcp-ace-gcpace-n01-b03-001
- assertVisible:
    id: patternly:session:details:gcp-ace-gcpace-n01-b03-001
- swipe:
    start: 50%,72%
    end: 50%,48%
    duration: 500
- assertVisible: 'This option selects at the billing account, but the decisive requirement is organization-wide attachment scope.'
- assertNotVisible: 'This option selects at one existing project, but the decisive requirement is organization-wide attachment scope.'
- assertNotVisible: 'This option selects at a single zone, but the decisive requirement is organization-wide attachment scope.'
- takeScreenshot: score27-selected-wrong-authored-diagnostic-restored
- swipe:
    start: 50%,72%
    end: 50%,58%
    duration: 500
- assertVisible: 'Organization Policy attaches constraints to hierarchy resources.*'
- takeScreenshot: score27-generic-details-alongside-authored-diagnostic
- tapOn:
    id: patternly:practice-review:result
- extendedWaitUntil:
    visible:
      id: patternly:summary:root:google-cloud-associate-cloud-engineer:certification-focus-practice:2
    timeout: 15000
- assertVisible: 'Session complete'
- assertVisible: '10 / 10'
- takeScreenshot: score27-same-completed-result-after-read-only-review
