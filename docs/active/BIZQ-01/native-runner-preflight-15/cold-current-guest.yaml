- stopApp
- launchApp:
    clearState: false
- openLink: "com.lkurczab.patternly://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- runFlow:
    when:
      visible: "Open|Otwórz"
    commands:
      - tapOn: "Open|Otwórz"
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 45000
- takeScreenshot: native15-current-guest
