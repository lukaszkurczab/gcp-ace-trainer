appId: com.lkurczab.patternly
name: BIZQ01 preserve accepted schedule on current runner
---
- stopApp
- launchApp:
    clearState: false
- openLink: "com.lkurczab.patternly://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- runFlow:
    when:
      visible: "Open|Otwórz"
    commands:
      - tapOn: "Open|Otwórz"
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 45000
- takeScreenshot: native15-current-guest
# Dismiss the developer warning observed in the preceding current-source screenshot.
- tapOn:
    point: "92%,93%"
- tapOn:
    id: main-tab-bar-progress
- extendedWaitUntil:
    visible:
      id: patternly:progress:root
    timeout: 30000
- scrollUntilVisible:
    element:
      id: patternly:progress-plan:edit-schedule
    direction: DOWN
    centerElement: true
- takeScreenshot: native15-existing-entry
- tapOn:
    id: patternly:progress-plan:edit-schedule
- extendedWaitUntil:
    visible:
      id: patternly:learning-plan:editor:state:ready
    timeout: 30000
- scrollUntilVisible:
    element:
      id: patternly:learning-plan:editor:time:mon
    direction: DOWN
    centerElement: true
- assertVisible:
    id: patternly:learning-plan:editor:time:mon
    text: '09:15'
- assertVisible:
    id: patternly:learning-plan:editor:time:wed
    text: '18:00'
- assertVisible:
    id: patternly:learning-plan:editor:time:sat
    text: '18:00'
- takeScreenshot: native15-cold-accepted-schedule
- tapOn: "Go back|Wróć"
- tapOn:
    id: main-tab-bar-settings
- extendedWaitUntil:
    visible:
      id: settings-identity
    timeout: 15000
- takeScreenshot: native15-account-state
- scrollUntilVisible:
    element:
      id: settings-premium
    direction: DOWN
- tapOn:
    id: settings-premium
- extendedWaitUntil:
    visible:
      id: premium-account-required
    timeout: 15000
- assertVisible:
    id: premium-offer-summary
- assertNotVisible:
    id: premium-success
- assertNotVisible:
    id: patternly:session:root:.*
- takeScreenshot: native15-real-guest-gate
- tapOn: "Go back|Wróć"
- tapOn:
    id: main-tab-bar-home
