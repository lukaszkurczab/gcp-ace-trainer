appId: com.lkurczab.patternly
name: BIZQ34 ordinary fresh Guest first-run and Home continuation
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-home|patternly:home:select-track:root"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: patternly:home:select-track:root
    commands:
      - tapOn:
          id: patternly:home:select-track:object-oriented-design-interview
      # Close the developer toast observed over Continue on the existing iPhone17.
      - tapOn:
          point: "92%,93%"
      - tapOn:
          id: patternly:home:select-track:continue
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 30000
- tapOn:
    id: main-tab-bar-home
- assertVisible:
    id: main-tab-bar-settings
- takeScreenshot: fresh-guest-home
