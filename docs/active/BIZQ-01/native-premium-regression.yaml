appId: com.lkurczab.patternly
name: BIZQ-01 guest Design Practice Premium gate regression
# Guest gate only: local fixture toggle cannot replace authenticated entitlement.
# Does not prove Premium session or corrected N02/N04 reachability.
---
- launchApp:
    clearState: false
- openLink: 'com.lkurczab.patternly://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- runFlow:
    when:
      visible:
        id: account-guest
    commands:
      - tapOn:
          id: account-guest
- runFlow:
    when:
      visible:
        id: premium-offer-summary
    commands:
      - tapOn: 'Go back|Wróć'
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 60000
- tapOn:
    id: main-tab-bar-home
- runFlow:
    when:
      notVisible:
        id: patternly:home:track-card:backend-system-design-interview
    commands:
      - runFlow:
          when:
            visible:
              id: patternly:home:change-track
          commands:
            - tapOn:
                id: patternly:home:change-track
      - scrollUntilVisible:
          element:
            id: patternly:home:select-track:backend-system-design-interview
          direction: DOWN
      - tapOn:
          id: patternly:home:select-track:backend-system-design-interview
      - tapOn:
          id: patternly:home:select-track:continue
- runFlow:
    when:
      visible:
        id: patternly:home:guest-goal-onboarding:not-now
    commands:
      - tapOn:
          id: patternly:home:guest-goal-onboarding:not-now
- tapOn:
    id: main-tab-bar-settings
- scrollUntilVisible:
    element:
      id: settings-premium-testing:.*
    direction: DOWN
- runFlow:
    when:
      visible:
        id: settings-premium-testing:enabled
    commands:
      - tapOn:
          id: settings-premium-testing:enabled
- assertVisible:
    id: settings-premium-testing:disabled
- tapOn:
    id: main-tab-bar-practice
- extendedWaitUntil:
    visible:
      id: patternly:practice:hub:root
    timeout: 30000
- scrollUntilVisible:
    element:
      id: patternly:practice:start-session
    direction: DOWN
- tapOn:
    id: patternly:practice:start-session
- extendedWaitUntil:
    visible:
      id: premium-offer-summary
    timeout: 30000
- assertNotVisible:
    id: patternly:session:root:.*
- takeScreenshot: bizq01-free-design-paywall
- tapOn: 'Go back|Wróć'
- tapOn:
    id: main-tab-bar-settings
- scrollUntilVisible:
    element:
      id: settings-premium-testing:disabled
    direction: DOWN
- tapOn:
    id: settings-premium-testing:disabled
- assertVisible:
    id: settings-premium-testing:enabled
- tapOn:
    id: main-tab-bar-practice
- scrollUntilVisible:
    element:
      id: patternly:practice:start-session
    direction: DOWN
- tapOn:
    id: patternly:practice:start-session
- extendedWaitUntil:
    visible:
      id: premium-offer-summary
    timeout: 30000
- assertNotVisible:
    id: patternly:session:root:.*
- takeScreenshot: bizq01-guest-testing-toggle-still-blocked
- tapOn: 'Go back|Wróć'
- tapOn:
    id: main-tab-bar-settings
- scrollUntilVisible:
    element:
      id: settings-premium-testing:enabled
    direction: DOWN
- tapOn:
    id: settings-premium-testing:enabled
- assertVisible:
    id: settings-premium-testing:disabled
- tapOn:
    id: main-tab-bar-home
- takeScreenshot: bizq01-guest-restored
- stopApp
