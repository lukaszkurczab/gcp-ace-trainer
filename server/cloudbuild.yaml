# Submitted manually from the repository root with --config=server/cloudbuild.yaml.
# The caller supplies _IMAGE_URI for the selected project's one Artifact Registry
# repository. The builder service account and Cloud Logging-only boundary are
# selected by the manual submit command; no trigger is defined here.
steps:
  # Source tag: gcr.io/cloud-builders/docker; captured 2026-08-09.
  - name: gcr.io/cloud-builders/docker@sha256:617f98016081e2978c0b44184d7b09446027b909f1078b8fdc23efc4c74c5f20
    dir: server
    args:
      - build
      - --pull
      - --tag
      - ${_IMAGE_URI}:${BUILD_ID}
      - .
images:
  - ${_IMAGE_URI}:${BUILD_ID}
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
