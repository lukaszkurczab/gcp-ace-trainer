appId: com.lkurczab.patternly
name: Patternly user testing — Settings boundary preflight
tags:
  - user-testing
  - settings
---
- tapOn:
    id: "main-tab-bar-home"
- tapOn:
    id: "main-tab-bar-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- assertVisible:
    id: "settings-appearance"
- assertVisible:
    id: "settings-language"
- swipe:
    direction: UP
- assertVisible:
    id: "settings-notifications"
- swipe:
    direction: UP
- assertVisible:
    id: "settings-your-data"
- assertVisible:
    id: "settings-legal-information"
- assertNotVisible: "Feedback"
- assertNotVisible: "Subscription"
