appId: com.lkurczab.patternly
name: Patternly RC — Certification Exam Simulation — prepare and suspend
tags:
  - rc-evidence
  - certification
  - exam-simulation
---
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- runFlow:
    when:
      visible:
        id: "patternly:home:select-track:root"
    commands:
      - scrollUntilVisible:
          element:
            id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
          direction: DOWN
          centerElement: true
      - tapOn:
          id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
      - tapOn:
          id: "patternly:home:select-track:continue"
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-home"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "patternly:home:change-track"
    commands:
      - tapOn:
          id: "patternly:home:change-track"
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
- tapOn: "Go back"
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- tapOn:
    id: "patternly:home:primary-action"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "patternly:practice:mode-card:certification-exam-simulation"
    direction: DOWN
- swipe:
    direction: UP
    duration: 500
- takeScreenshot: "rc-certification-practice-hub"
- tapOn:
    id: "patternly:practice:mode-card:certification-exam-simulation"
- extendedWaitUntil:
    visible: "Question 1 of 50"
    timeout: 30000
- takeScreenshot: "rc-certification-exam-question-1"
- scrollUntilVisible:
    element:
      id: "patternly:simulation:option:gcp-ace-gcpace-n01-b02-001:a"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "patternly:simulation:option:gcp-ace-gcpace-n01-b02-001:a"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "patternly:simulation:option:gcp-ace-gcpace-n01-b02-001:b"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "patternly:simulation:option:gcp-ace-gcpace-n01-b02-001:b"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Next"
- assertVisible: "Question 2 of 50"
- tapOn: "Previous"
- assertVisible: "Question 1 of 50"
- assertVisible:
    id: "patternly:simulation:option:gcp-ace-gcpace-n01-b02-001:b"
- takeScreenshot: "rc-certification-exam-answer-changed-and-restored"
- tapOn: "Flag question"
- assertVisible: "Remove flag"
- tapOn: "Question navigator"
- assertVisible: "Question navigator"
- assertVisible: "Question 1, current, answered and saved, flagged"
- takeScreenshot: "rc-certification-exam-navigator-flagged"
- tapOn: "Question 50, unanswered"
- assertVisible: "Question 50 of 50"
- takeScreenshot: "rc-certification-exam-question-50-before-relaunch"
