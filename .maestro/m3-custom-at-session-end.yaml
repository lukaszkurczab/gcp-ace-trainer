appId: com.lkurczab.patternly
name: Patternly M3 — Custom Practice at session end survives relaunch
tags:
  - runtime-auditability
  - m3
---
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-practice"
- tapOn:
    id: "patternly:practice:open-setup"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:setup:root"
    timeout: 30000
- tapOn:
    id: "patternly:practice:session-length:10"
- tapOn:
    id: "patternly:practice:feedback-timing:at-session-end"
- tapOn:
    id: "patternly:practice:start-session"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-001"
    timeout: 30000
- assertVisible:
    id: "patternly:session:configuration:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1:length:10:feedback-timing:at-session-end"
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-001:sequence_average"
- tapOn:
    id: "patternly:session:submit:alg-complexity-amortized-001"
- assertNotVisible:
    id: "patternly:session:feedback:alg-complexity-amortized-001"
- assertNotVisible:
    id: "patternly:session:result:alg-complexity-amortized-001:correct"
- assertNotVisible:
    id: "patternly:session:reason:alg-complexity-amortized-001"
- assertNotVisible:
    id: "patternly:session:details:alg-complexity-amortized-001"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-002"
    timeout: 10000
- tapOn:
    id: "patternly:session:leave:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1"
- tapOn:
    id: "patternly:session:leave-and-resume:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1"
- killApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "patternly:resume:card:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1"
    timeout: 30000
- tapOn:
    id: "patternly:resume:continue:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1"
- extendedWaitUntil:
    visible:
      id: "patternly:session:root:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1"
    timeout: 30000
- assertVisible:
    id: "patternly:session:question:alg-complexity-amortized-002"
- assertVisible:
    id: "patternly:session:configuration:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1:length:10:feedback-timing:at-session-end"
- assertNotVisible:
    id: "patternly:session:feedback:alg-complexity-amortized-001"
- assertNotVisible:
    id: "patternly:session:result:alg-complexity-amortized-001:correct"
- assertNotVisible:
    id: "patternly:session:reason:alg-complexity-amortized-001"
- assertNotVisible:
    id: "patternly:session:details:alg-complexity-amortized-001"
