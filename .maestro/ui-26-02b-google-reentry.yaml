appId: com.lkurczab.patternly
name: UI-26-02B created Google account mapped reentry and cold persistence
---
- assertVisible:
    id: account-sign-in-submit
- openLink: 'com.lkurczab.patternly://audit/provider-auth?runId=ui02b-google-unmapped-20260930&provider=google&scenario=mapped'
- extendedWaitUntil:
    visible:
      id: provider-auth-fixture-active
    timeout: 10000
- scrollUntilVisible:
    element:
      id: account-provider-google
    direction: DOWN
- tapOn:
    id: account-provider-google
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 45000
- assertNotVisible:
    id: provider-registration-review
- assertNotVisible:
    id: account-entry-choice
- assertVisible: '.*Complexity and constraints.*'
- takeScreenshot: created-google-mapped-reentry-original-plan
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 45000
- assertVisible: '.*Complexity and constraints.*'
- assertNotVisible:
    id: provider-registration-review
- assertNotVisible:
    id: account-entry-choice
- takeScreenshot: google-original-plan-after-cold-restart
- tapOn:
    id: main-tab-bar-settings
- scrollUntilVisible:
    element:
      id: settings-sign-out
    direction: DOWN
    centerElement: true
- tapOn:
    id: settings-sign-out
- extendedWaitUntil:
    visible:
      id: account-sign-in-submit
    timeout: 30000
- tapOn:
    id: account-sign-in-guest
- extendedWaitUntil:
    visible:
      id: patternly:home:select-track:root
    timeout: 30000
- assertNotVisible: '.*Complexity and constraints.*'
- tapOn:
    id: patternly:home:select-track:continue
- extendedWaitUntil:
    visible:
      id: patternly:home:guest-goal-onboarding:not-now
    timeout: 20000
- tapOn:
    id: patternly:home:guest-goal-onboarding:not-now
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 15000
- takeScreenshot: fresh-guest-after-created-account-logout
