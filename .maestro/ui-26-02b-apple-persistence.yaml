appId: com.lkurczab.patternly
name: UI-26-02B Apple account actual cold restart persistence
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 45000
- assertNotVisible:
    id: provider-registration-review
- assertNotVisible:
    id: account-entry-choice
- tapOn:
    id: main-tab-bar-settings
- scrollUntilVisible:
    element:
      id: settings-goal
    direction: DOWN
- tapOn:
    id: settings-goal
- extendedWaitUntil:
    visible:
      id: patternly:goal:root
    timeout: 15000
- assertVisible: Utrzymywanie formy
- scrollUntilVisible:
    element:
      text: 'Pt.'
    direction: DOWN
- assertVisible: 'Pt.'
- takeScreenshot: apple-goal-friday-persisted-after-cold-restart
- scrollUntilVisible:
    element:
      text: Wróć
      index: 0
    direction: UP
- tapOn:
    text: Wróć
    index: 0
- tapOn:
    id: main-tab-bar-settings
- scrollUntilVisible:
    element:
      id: settings-sign-out
    direction: DOWN
    centerElement: true
- tapOn:
    id: settings-sign-out
- extendedWaitUntil:
    visible:
      id: account-sign-in-submit
    timeout: 30000
- assertNotVisible:
    id: provider-registration-review
- takeScreenshot: apple-signed-out-after-persistence
