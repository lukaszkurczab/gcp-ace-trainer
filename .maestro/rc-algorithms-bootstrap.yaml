appId: com.lkurczab.patternly
name: Patternly RC — Algorithms bootstrap
tags:
  - rc-evidence
  - algorithms
---
- runFlow:
    when:
      visible:
        id: "patternly:home:change-track"
    commands:
      - tapOn:
          id: "patternly:home:change-track"
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:algorithms"
    direction: DOWN
    centerElement: false
    timeout: 30000
    visibilityPercentage: 50
- tapOn:
    id: "patternly:home:select-track:algorithms"
- scrollUntilVisible:
    element:
      id: "patternly:home:track-card:algorithms"
    direction: DOWN
    centerElement: false
    timeout: 30000
    visibilityPercentage: 20
