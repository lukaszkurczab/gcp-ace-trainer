appId: com.lkurczab.gcpacetrainer
name: Patternly M7 — remediation smoke
tags:
  - algorithms-completion-evidence
  - m7
---
- openLink: "com.lkurczab.gcpacetrainer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- waitForAnimationToEnd:
    timeout: 30000
- openLink: "com.lkurczab.gcpacetrainer://audit/reset-learning-state"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:algorithms"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-practice"
- assertVisible:
    id: "patternly:practice:hub:root"
- tapOn:
    id: "patternly:practice:open-setup"
- assertVisible:
    id: "patternly:practice:setup:root"
- tapOn:
    id: "patternly:practice:session-length:10"
- tapOn:
    id: "patternly:practice:start-session"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-001"
    timeout: 30000
- assertVisible:
    id: "patternly:session:configuration:algorithms:algorithms-custom-practice:1:length:10:feedback-timing:after-each-answer"
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-001:each_worst_constant"
- tapOn:
    id: "patternly:session:submit:alg-complexity-amortized-001"
- scrollUntilVisible:
    element:
      id: "patternly:session:feedback:alg-complexity-amortized-001"
    direction: DOWN
- assertVisible:
    id: "patternly:session:result:alg-complexity-amortized-001:incorrect"
- scrollUntilVisible:
    element:
      id: "patternly:session:leave:algorithms:algorithms-custom-practice:1"
    direction: DOWN
- tapOn:
    id: "patternly:session:leave:algorithms:algorithms-custom-practice:1"
- tapOn:
    id: "patternly:session:abandon:algorithms:algorithms-custom-practice:1"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- openLink: "com.lkurczab.gcpacetrainer://audit/clock/advance?milliseconds=86400000"
- tapOn:
    id: "patternly:practice:mode-card:algorithms-weak-area-review"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-001"
    timeout: 30000
- assertVisible:
    id: "patternly:session:mode:algorithms-weak-area-review"
- takeScreenshot: m7-remediation-item
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-001:sequence_average"
- tapOn:
    id: "patternly:session:submit:alg-complexity-amortized-001"
- scrollUntilVisible:
    element:
      id: "patternly:session:feedback:alg-complexity-amortized-001"
    direction: DOWN
- assertVisible:
    id: "patternly:session:result:alg-complexity-amortized-001:correct"
- takeScreenshot: m7-remediation-correct-feedback
- scrollUntilVisible:
    element:
      id: "patternly:session:leave:algorithms:algorithms-weak-area-review:2"
    direction: DOWN
- tapOn:
    id: "patternly:session:leave:algorithms:algorithms-weak-area-review:2"
- tapOn:
    id: "patternly:session:abandon:algorithms:algorithms-weak-area-review:2"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-progress"
- assertVisible:
    id: "patternly:progress:root"
- assertVisible:
    id: "patternly:progress:node:complexity_and_constraints"
- takeScreenshot: m7-remediation-progress
- killApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:algorithms"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-progress"
- assertVisible:
    id: "patternly:progress:root"
- assertVisible:
    id: "patternly:progress:node:complexity_and_constraints"
