appId: com.lkurczab.patternly
name: Patternly M2 — Custom Practice 10 at session end
tags:
  - runtime-auditability
  - m2
---
- runFlow: completed-practice-result-review.yaml
- runFlow: coding-practice-answer-review-details.yaml

- tapOn:
    id: "patternly:summary:back-to-practice:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1"
- assertVisible:
    id: "patternly:practice:hub:root"
- tapOn:
    id: "main-tab-bar-progress"
- assertVisible:
    id: "patternly:progress:root"
- tapOn:
    id: "main-tab-bar-home"
- assertVisible:
    id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
- killApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- assertNotVisible:
    id: "patternly:resume:card:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1"
