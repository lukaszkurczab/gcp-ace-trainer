appId: com.lkurczab.patternly
name: UI-26-02B mapped identity ${PROVIDER}
---
- runFlow:
    when:
      visible:
        id: main-tab-bar-settings
    commands:
      - tapOn:
          id: main-tab-bar-settings
      - extendedWaitUntil:
          visible:
            id: settings-screen
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: settings-account-entry
          direction: UP
      - tapOn:
          id: settings-account-entry
- extendedWaitUntil:
    visible:
      id: account-sign-in-submit
    timeout: 30000
- openLink: 'com.lkurczab.patternly://audit/provider-auth?runId=${RUN_ID}&provider=${PROVIDER}&scenario=mapped'
- extendedWaitUntil:
    visible:
      id: provider-auth-fixture-active
    timeout: 10000
- takeScreenshot: armed-mapped
- scrollUntilVisible:
    element:
      id: 'account-provider-${PROVIDER}'
    direction: DOWN
- tapOn:
    id: 'account-provider-${PROVIDER}'
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-home|patternly:home:select-track:root"
    timeout: 60000
- assertNotVisible:
    id: provider-registration-review
- assertNotVisible:
    id: account-entry-choice
- assertNotVisible: '.*Complexity and constraints.*'
- takeScreenshot: mapped-account-no-guest-plan
