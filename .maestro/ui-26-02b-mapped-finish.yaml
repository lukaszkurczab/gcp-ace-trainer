appId: com.lkurczab.patternly
name: UI-26-02B mapped empty account navigation and Guest return
---
- assertVisible:
    id: patternly:home:select-track:root
- assertNotVisible:
    id: account-entry-choice
- assertNotVisible:
    id: provider-registration-review
- takeScreenshot: mapped-empty-account-track-selection
- tapOn: Start track
- runFlow:
    when:
      visible:
        id: patternly:home:guest-goal-onboarding:not-now
    commands:
      - tapOn:
          id: patternly:home:guest-goal-onboarding:not-now
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 30000
- assertNotVisible: '.*Complexity and constraints.*'
- takeScreenshot: mapped-home-without-guest-plan
- tapOn:
    id: main-tab-bar-settings
- scrollUntilVisible:
    element:
      id: settings-sign-out
    direction: DOWN
- tapOn:
    id: settings-sign-out
- extendedWaitUntil:
    visible:
      id: account-sign-in-submit
    timeout: 30000
- tapOn:
    id: account-sign-in-guest
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 30000
- assertVisible: '.*Complexity and constraints.*'
- takeScreenshot: guest-plan-retained-after-mapped-logout
