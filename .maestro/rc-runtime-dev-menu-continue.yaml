appId: com.lkurczab.patternly
name: Patternly RC — development menu continue
tags:
  - rc-evidence
---
- runFlow:
    when:
      visible: "Otwórz"
    commands:
      - tapOn: "Otwórz"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
- runFlow:
    when:
      visible: "http://127.0.0.1:8081"
    commands:
      - tapOn: "http://127.0.0.1:8081"
- tapOn:
    text: "Continue"
    optional: true
    retryTapIfNoChange: true
- tapOn:
    text: "Continue"
    optional: true
    retryTapIfNoChange: true
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
