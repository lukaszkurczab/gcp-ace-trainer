appId: com.lkurczab.patternly
name: ODK-E2E-102 goal day localization
tags:
  - e2e
  - goal
  - localization
  - screenshot
---
- launchApp:
    clearState: false
    stopApp: true
- openLink: ${PATTERNLY_DEV_CLIENT_URL}
- extendedWaitUntil:
    visible:
      id: "main-tab-bar"
    timeout: 30000
- tapOn:
    point: "92%,93%"
- tapOn:
    id: "main-tab-bar-settings"
- scrollUntilVisible:
    element:
      id: "settings-language"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-language"
- tapOn:
    id: "language-option-pl"
- tapOn: "Wróć"
- scrollUntilVisible:
    element:
      id: "settings-goal"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-goal"
- extendedWaitUntil:
    visible:
      id: "patternly:goal:root"
    timeout: 30000
- scrollUntilVisible:
    element: "Preferowane dni"
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: goal__days__010__settings-summary__pl
- scrollUntilVisible:
    element: "Edytuj cel"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Edytuj cel"
- scrollUntilVisible:
    element:
      id: "patternly:goal:day:mon"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: "patternly:goal:day:mon"
- assertVisible:
    id: "patternly:goal:day:tue"
- assertVisible:
    id: "patternly:goal:day:wed"
- assertVisible:
    id: "patternly:goal:day:thu"
- assertVisible:
    id: "patternly:goal:day:fri"
- assertVisible:
    id: "patternly:goal:day:sat"
- assertVisible:
    id: "patternly:goal:day:sun"
- takeScreenshot: goal__days__020__settings-form-all-days__pl
- scrollUntilVisible:
    element: "Wróć"
    direction: UP
    timeout: 30000
- tapOn: "Wróć"
- tapOn:
    id: "main-tab-bar-progress"
- extendedWaitUntil:
    visible:
      id: "patternly:progress:goal"
    timeout: 30000
- tapOn:
    id: "patternly:progress:goal"
- scrollUntilVisible:
    element: "Preferowane dni"
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: goal__days__030__progress-summary__pl
- scrollUntilVisible:
    element: "Edytuj cel"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Edytuj cel"
- scrollUntilVisible:
    element:
      id: "patternly:goal:day:mon"
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: goal__days__040__progress-form-all-days__pl
- scrollUntilVisible:
    element: "Wróć"
    direction: UP
    timeout: 30000
- tapOn: "Wróć"
- tapOn:
    id: "main-tab-bar-settings"
- scrollUntilVisible:
    element:
      id: "settings-language"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-language"
- tapOn:
    id: "language-option-en"
- tapOn: "Go back"
- scrollUntilVisible:
    element:
      id: "settings-goal"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-goal"
- scrollUntilVisible:
    element: "Preferred days"
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: goal__days__050__settings-summary__en
- scrollUntilVisible:
    element: "Edit goal"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Edit goal"
- scrollUntilVisible:
    element:
      id: "patternly:goal:day:mon"
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: goal__days__060__settings-form-all-days__en
- scrollUntilVisible:
    element: "Go back"
    direction: UP
    timeout: 30000
- tapOn: "Go back"
- tapOn:
    id: "main-tab-bar-progress"
- extendedWaitUntil:
    visible:
      id: "patternly:progress:goal"
    timeout: 30000
- tapOn:
    id: "patternly:progress:goal"
- scrollUntilVisible:
    element: "Preferred days"
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: goal__days__070__progress-summary__en
- scrollUntilVisible:
    element: "Edit goal"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Edit goal"
- scrollUntilVisible:
    element:
      id: "patternly:goal:day:mon"
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: goal__days__080__progress-form-all-days__en
