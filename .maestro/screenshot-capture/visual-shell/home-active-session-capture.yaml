appId: com.lkurczab.patternly
name: Patternly visual shell — Home active session capture
tags:
  - screenshot
  - uiux-evidence
  - home-active-session
---
- runFlow:
    when:
      visible: "(Session complete|Partial summary)"
    commands:
      - tapOn: "Back to practice"
- runFlow:
    when:
      visible: "Session in progress"
    commands:
      - tapOn:
          id: "main-tab-bar-practice"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- tapOn:
    id: "patternly:practice:start-session"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-001"
    timeout: 30000
- tapOn: "Leave session"
- extendedWaitUntil:
    visible: "Pause or end this session?"
    timeout: 30000
- tapOn: "Pause and resume later"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000

- tapOn:
    id: "main-tab-bar-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- tapOn:
    id: "settings-appearance"
- extendedWaitUntil:
    visible: "Choose how Patternly looks on this device."
    timeout: 30000
- tapOn: "^${THEME_LABEL},.*"
- tapOn: "Go back"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-home"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__home__active-session__${THEME}__${DEVICE_PROFILE}"
