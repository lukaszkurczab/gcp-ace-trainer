appId: com.lkurczab.patternly
name: Patternly visual shell — notification permission states
tags:
  - screenshot
  - uiux-evidence
---
- runFlow:
    when:
      visible: "Choose how Patternly looks on this device."
    commands:
      - tapOn: "Go back"
- runFlow:
    when:
      visible:
        id: "main-tab-bar-settings"
    commands:
      - tapOn:
          id: "main-tab-bar-settings"
- runFlow:
    when:
      visible:
        id: "settings-screen"
    commands:
      - tapOn:
          id: "settings-appearance"
      - extendedWaitUntil:
          visible: "Choose how Patternly looks on this device."
          timeout: 30000
      - tapOn: "^${THEME_LABEL},.*"
      - tapOn: "Go back"
- runFlow:
    when:
      visible:
        id: "settings-screen"
    commands:
      - tapOn:
          id: "settings-notifications"
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 30000
- runFlow:
    when:
      visible: "Enable notifications"
    commands:
      - tapOn: "Enable notifications"
      - tapOn: "Allow"
- extendedWaitUntil:
    visible: "Notifications allowed"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__notifications__granted__${THEME}__${DEVICE_PROFILE}"
- runFlow:
    when:
      visible: "Daily reminder, Off"
    commands:
      - tapOn: "Daily reminder, Off"
      - extendedWaitUntil:
          visible: "Choose when Patternly should remind you to practise."
          timeout: 30000
      - tapOn: "Save reminder"
      - extendedWaitUntil:
          visible: "Daily reminder, 20:00"
          timeout: 30000
- runFlow:
    when:
      visible: "Daily reminder, 20:00"
    commands:
      - tapOn: "Daily reminder, 20:00"
- extendedWaitUntil:
    visible: "Turn off reminder"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__notifications__editor__${THEME}__${DEVICE_PROFILE}"
