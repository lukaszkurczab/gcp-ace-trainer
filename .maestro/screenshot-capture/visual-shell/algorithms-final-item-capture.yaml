appId: com.lkurczab.patternly
name: Patternly visual shell — Algorithms final item
tags:
  - screenshot
  - uiux-evidence
  - algorithms
---
- launchApp
- runFlow:
    when:
      visible: "Session complete"
    commands:
      - tapOn: "Back to practice"
      - extendedWaitUntil:
          visible:
            id: "patternly:practice:hub:root"
          timeout: 30000
- runFlow:
    when:
      visible: "Notifications"
    commands:
      - tapOn: "Go back"
- runFlow:
    when:
      visible:
        id: "settings-screen"
    commands:
      - tapOn:
          id: "settings-appearance"
      - extendedWaitUntil:
          visible: "Choose how Patternly looks on this device."
          timeout: 30000
      - tapOn: "^${THEME_LABEL},.*"
      - tapOn: "Go back"
- runFlow:
    when:
      visible:
        id: "main-tab-bar-settings"
    commands:
      - tapOn:
          id: "main-tab-bar-home"
- runFlow:
    when:
      visible:
        id: "patternly:practice:hub:root"
    commands:
      - tapOn:
          id: "main-tab-bar-home"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "main-tab-bar-home"
    commands:
      - tapOn:
          id: "main-tab-bar-settings"
      - extendedWaitUntil:
          visible:
            id: "settings-screen"
          timeout: 30000
      - tapOn:
          id: "settings-appearance"
      - extendedWaitUntil:
          visible: "Choose how Patternly looks on this device."
          timeout: 30000
      - tapOn: "^${THEME_LABEL},.*"
      - tapOn: "Go back"
      - tapOn:
          id: "main-tab-bar-home"
- runFlow:
    when:
      visible: "Resume session"
    commands:
      - tapOn: "Resume session"
- runFlow:
    when:
      visible:
        id: "main-tab-bar-home"
    commands:
      - tapOn:
          id: "main-tab-bar-practice"
      - extendedWaitUntil:
          visible:
            id: "patternly:practice:hub:root"
          timeout: 30000
      - tapOn:
          id: "patternly:practice:open-setup"
      - extendedWaitUntil:
          visible:
            id: "patternly:practice:setup:root"
          timeout: 30000
      - tapOn:
          id: "patternly:practice:session-length:10"
      - tapOn:
          id: "patternly:practice:feedback-timing:after-each-answer"
      - tapOn:
          id: "patternly:practice:start-session"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-001"
    timeout: 30000
- tapOn: "Leave session"
- extendedWaitUntil:
    visible: "Pause or end this session?"
    timeout: 30000
- tapOn: "Pause and resume later"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:setup:root"
    timeout: 30000
- runFlow: algorithms-completed-summary-capture.yaml
