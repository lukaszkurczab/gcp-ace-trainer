appId: com.lkurczab.patternly
name: Patternly visual shell — current blocked notification permission
tags:
  - screenshot
  - uiux-evidence
---
- launchApp
- runFlow:
    when:
      visible:
        id: "main-tab-bar-settings"
    commands:
      - tapOn:
          id: "main-tab-bar-settings"
- runFlow:
    when:
      visible:
        id: "settings-screen"
    commands:
      - tapOn:
          id: "settings-notifications"
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 30000
- runFlow:
    when:
      visible: "Open device settings"
    commands:
      - tapOn: "Open device settings"
      - extendedWaitUntil:
          visible: "Apps"
          timeout: 30000
      - scrollUntilVisible:
          element: "Patternly"
          direction: DOWN
          timeout: 30000
      - tapOn: "Patternly"
      - tapOn: "Notifications"
      - extendedWaitUntil:
          visible: "Allow Notifications"
          timeout: 30000
      - tapOn: "Return to Patternly"
      - launchApp
- runFlow:
    when:
      visible:
        id: "main-tab-bar-settings"
    commands:
      - tapOn:
          id: "main-tab-bar-settings"
      - tapOn:
          id: "settings-notifications"
- extendedWaitUntil:
    visible: "Notifications are blocked"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__notifications__blocked__${THEME}__${DEVICE_PROFILE}"
