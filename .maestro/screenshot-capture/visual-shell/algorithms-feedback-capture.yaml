appId: com.lkurczab.patternly
name: Patternly visual shell — Algorithms feedback and details
tags:
  - screenshot
  - uiux-evidence
  - algorithms
---
- launchApp
- runFlow:
    when:
      visible:
        id: "patternly:practice:setup:root"
    commands:
      - tapOn: "Go back"
      - extendedWaitUntil:
          visible:
            id: "patternly:practice:hub:root"
          timeout: 30000
- runFlow:
    when:
      visible: "Session complete"
    commands:
      - tapOn: "Back to practice"
      - extendedWaitUntil:
          visible:
            id: "patternly:practice:hub:root"
          timeout: 30000
- runFlow:
    when:
      visible: "Notifications"
    commands:
      - tapOn: "Go back"
- runFlow:
    when:
      visible:
        id: "settings-screen"
    commands:
      - tapOn:
          id: "settings-appearance"
      - extendedWaitUntil:
          visible: "Choose how Patternly looks on this device."
          timeout: 30000
      - tapOn: "^${THEME_LABEL},.*"
      - tapOn: "Go back"
- runFlow:
    when:
      visible:
        id: "main-tab-bar-settings"
    commands:
      - tapOn:
          id: "main-tab-bar-home"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    commands:
      - tapOn:
          id: "main-tab-bar-settings"
      - extendedWaitUntil:
          visible:
            id: "settings-screen"
          timeout: 30000
      - tapOn:
          id: "settings-appearance"
      - extendedWaitUntil:
          visible: "Choose how Patternly looks on this device."
          timeout: 30000
      - tapOn: "^${THEME_LABEL},.*"
      - tapOn: "Go back"
      - tapOn:
          id: "main-tab-bar-home"
      - extendedWaitUntil:
          visible:
            id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
          timeout: 30000
- tapOn:
    id: "main-tab-bar-practice"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- tapOn:
    id: "patternly:practice:open-setup"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:setup:root"
    timeout: 30000
- tapOn:
    id: "patternly:practice:session-length:10"
- tapOn:
    id: "patternly:practice:feedback-timing:after-each-answer"
- tapOn:
    id: "patternly:practice:start-session"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-001"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__algorithms__question__${THEME}__${DEVICE_PROFILE}"
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-001:each_worst_constant"
- runFlow:
    when:
      visible:
        id: "patternly:session:submit:alg-complexity-amortized-001"
    commands:
      - tapOn:
          id: "patternly:session:submit:alg-complexity-amortized-001"
- scrollUntilVisible:
    element:
      id: "patternly:session:feedback:alg-complexity-amortized-001"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: "patternly:session:result:alg-complexity-amortized-001:incorrect"
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__algorithms__feedback__incorrect__${THEME}__${DEVICE_PROFILE}"
- scrollUntilVisible:
    element:
      id: "patternly:session:details-toggle:alg-complexity-amortized-001"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "patternly:session:details-toggle:alg-complexity-amortized-001"
- assertVisible:
    id: "patternly:session:details:alg-complexity-amortized-001"
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__algorithms__feedback-details__expanded__${THEME}__${DEVICE_PROFILE}"
- tapOn: "Leave session"
- extendedWaitUntil:
    visible: "Pause or end this session?"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__algorithms__practice-exit-sheet__${THEME}__${DEVICE_PROFILE}"
- tapOn: "Pause and resume later"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:setup:root"
    timeout: 30000
