appId: com.lkurczab.patternly
name: Patternly visual shell — completed deferred-feedback summary
tags:
  - screenshot
  - uiux-evidence
  - algorithms
  - summary
---
- launchApp
- runFlow:
    when:
      visible: "Session complete"
    commands:
      - tapOn: "Back to practice"
      - extendedWaitUntil:
          visible:
            id: "patternly:practice:hub:root"
          timeout: 30000
- runFlow:
    when:
      visible:
        id: "main-tab-bar-home"
    commands:
      - tapOn:
          id: "main-tab-bar-home"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-practice"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- tapOn:
    id: "patternly:practice:open-setup"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:setup:root"
    timeout: 30000
- tapOn:
    id: "patternly:practice:session-length:10"
- tapOn:
    id: "patternly:practice:feedback-timing:at-session-end"
- tapOn:
    id: "patternly:practice:start-session"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-001"
    timeout: 30000
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-001:sequence_average"
- tapOn:
    id: "patternly:session:submit:alg-complexity-amortized-001"
- tapOn:
    id: "patternly:session:continue:alg-complexity-amortized-001"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-002"
    timeout: 30000
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-002:same"
- tapOn:
    id: "patternly:session:submit:alg-complexity-amortized-002"
- tapOn:
    id: "patternly:session:continue:alg-complexity-amortized-002"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-003"
    timeout: 30000
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-003:worst_n_amortized_1"
- tapOn:
    id: "patternly:session:submit:alg-complexity-amortized-003"
- tapOn:
    id: "patternly:session:continue:alg-complexity-amortized-003"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-004"
    timeout: 30000
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-004:copy_never"
- tapOn:
    id: "patternly:session:submit:alg-complexity-amortized-004"
- tapOn:
    id: "patternly:session:continue:alg-complexity-amortized-004"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-005"
    timeout: 30000
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-005:each_item_once"
- tapOn:
    id: "patternly:session:submit:alg-complexity-amortized-005"
- tapOn:
    id: "patternly:session:continue:alg-complexity-amortized-005"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-006"
    timeout: 30000
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-006:every_increment_one_flip"
- tapOn:
    id: "patternly:session:submit:alg-complexity-amortized-006"
- tapOn:
    id: "patternly:session:continue:alg-complexity-amortized-006"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-007"
    timeout: 30000
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-007:yes_individual_expensive"
- tapOn:
    id: "patternly:session:submit:alg-complexity-amortized-007"
- tapOn:
    id: "patternly:session:continue:alg-complexity-amortized-007"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-008"
    timeout: 30000
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-008:yes_usually"
- tapOn:
    id: "patternly:session:submit:alg-complexity-amortized-008"
- tapOn:
    id: "patternly:session:continue:alg-complexity-amortized-008"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-009"
    timeout: 30000
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-009:total_n_linear"
- tapOn:
    id: "patternly:session:submit:alg-complexity-amortized-009"
- tapOn:
    id: "patternly:session:continue:alg-complexity-amortized-009"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-010"
    timeout: 30000
- tapOn:
    id: "patternly:session:option:alg-complexity-amortized-010:amortized_each"
- tapOn:
    id: "patternly:session:submit:alg-complexity-amortized-010"
- tapOn:
    id: "patternly:session:continue:alg-complexity-amortized-010"
- extendedWaitUntil:
    visible: "Session complete"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__algorithms__summary-deferred__completed__${THEME}__${DEVICE_PROFILE}"
- scrollUntilVisible:
    element: "Review answers"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Review answers"
- tapOn: "Review answers"
- extendedWaitUntil:
    visible: "Answer review"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__algorithms__summary-deferred-review__expanded__${THEME}__${DEVICE_PROFILE}"
