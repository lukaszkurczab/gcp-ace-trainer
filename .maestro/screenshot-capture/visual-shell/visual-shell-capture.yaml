appId: com.lkurczab.patternly
name: Patternly visual shell — shared capture journey
tags:
  - screenshot
  - uiux-evidence
---
# The resetless release entry point and the development reset entry point share
# exactly this learner journey; only their preparation boundary differs.
- runFlow:
    when:
      visible: "Choose a track"
    commands:
      - tapOn: "Go back"
      - extendedWaitUntil:
          visible:
            id: "patternly:home:change-track"
          timeout: 30000
- extendedWaitUntil:
    visible:
      id: "patternly:home:change-track"
    timeout: 30000
- tapOn:
    id: "patternly:home:change-track"
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:coding-interview-dsa-problem-solving"
    direction: DOWN
    centerElement: true
    timeout: 30000
    visibilityPercentage: 50
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__005__track-selection-ready__${THEME}__${DEVICE_PROFILE}"
- tapOn:
    id: "patternly:home:select-track:coding-interview-dsa-problem-solving"
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:continue"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "patternly:home:select-track:continue"
- scrollUntilVisible:
    element:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    direction: DOWN
    centerElement: false
    timeout: 30000
    visibilityPercentage: 20
- assertVisible:
    id: "patternly:home:track-card:coding-interview-dsa-problem-solving"

# Select the requested persisted app theme before taking evidence.
- tapOn:
    id: "main-tab-bar-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- tapOn:
    id: "settings-appearance"
- extendedWaitUntil:
    visible: "Choose how Patternly looks on this device."
    timeout: 30000
- tapOn: "^${THEME_LABEL},.*"
- tapOn: "Go back"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- assertVisible: ".*${THEME_LABEL}.*"
- tapOn:
    id: "main-tab-bar-home"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__010__home-ready__${THEME}__${DEVICE_PROFILE}"

- tapOn:
    id: "main-tab-bar-practice"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "patternly:practice:open-setup"
    direction: DOWN
    centerElement: true
    timeout: 30000
    visibilityPercentage: 50
- tapOn:
    id: "patternly:practice:open-setup"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:setup:root"
    timeout: 30000
- assertVisible:
    id: "patternly:practice:custom-setup-title"
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__020__custom-practice-setup-ready__${THEME}__${DEVICE_PROFILE}"
- scrollUntilVisible:
    element:
      id: "patternly:practice:start-session"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 50
- tapOn:
    id: "patternly:practice:start-session"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-001"
    timeout: 30000
- assertVisible:
    id: "patternly:session:question:alg-complexity-amortized-001"
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__030__algorithms-active-session-ready__${THEME}__${DEVICE_PROFILE}"

- tapOn: "Leave session"
- extendedWaitUntil:
    visible: "Pause or end this session?"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__035__practice-exit-sheet-ready__${THEME}__${DEVICE_PROFILE}"
- tapOn: "End and view summary"
- extendedWaitUntil:
    visible: "Partial summary"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__040__partial-session-summary-ready__${THEME}__${DEVICE_PROFILE}"

- tapOn: "Back to practice"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-progress"
- extendedWaitUntil:
    visible:
      id: "patternly:progress:root"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__045__progress-ready__${THEME}__${DEVICE_PROFILE}"
- tapOn:
    id: "main-tab-bar-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- assertVisible:
    id: "settings-appearance"
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__050__settings-root-ready__${THEME}__${DEVICE_PROFILE}"

- tapOn:
    id: "settings-notifications"
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__055__notifications-ready__${THEME}__${DEVICE_PROFILE}"
- tapOn: "Go back"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "settings-your-data"
    direction: DOWN
    centerElement: true
    timeout: 30000
    visibilityPercentage: 50
- tapOn:
    id: "settings-your-data"
- extendedWaitUntil:
    visible: "Data & privacy"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__057__data-privacy-ready__${THEME}__${DEVICE_PROFILE}"
- tapOn: "Go back"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000

- tapOn:
    id: "settings-appearance"
- extendedWaitUntil:
    visible: "Choose how Patternly looks on this device."
    timeout: 30000
- assertVisible: "^${THEME_LABEL},.*"
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__060__appearance-ready__${THEME}__${DEVICE_PROFILE}"
