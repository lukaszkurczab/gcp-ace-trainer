appId: com.lkurczab.patternly
name: Patternly visual shell — six stable checkpoints
tags:
  - screenshot
  - uiux-evidence
  - visual-shell
---
# Required environment: SCREENSHOT_ROOT, THEME, THEME_LABEL, DEVICE_PROFILE.
# The audit reset is the only fixture boundary; the remaining state is produced
# through the canonical learner journey.
- openLink: "com.lkurczab.patternly://audit/reset-learning-state"
- extendedWaitUntil:
    visible:
      id: "patternly:content:ready-after-audit-reset"
    timeout: 30000
# The audit reset deliberately preserves the user's selected track. Use the
# canonical RC bootstrap split for both first-use and returning Home states.
- runFlow:
    when:
      visible:
        id: "patternly:home:change-track"
    commands:
      - tapOn:
          id: "patternly:home:change-track"
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:coding-interview-dsa-problem-solving"
    direction: DOWN
    centerElement: true
    timeout: 30000
    visibilityPercentage: 50
- tapOn:
    id: "patternly:home:select-track:coding-interview-dsa-problem-solving"
- scrollUntilVisible:
    element:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    direction: DOWN
    centerElement: false
    timeout: 30000
    visibilityPercentage: 20
- assertVisible:
    id: "patternly:home:track-card:coding-interview-dsa-problem-solving"

# Select the requested persisted app theme before taking evidence.
- tapOn:
    id: "main-tab-bar-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- tapOn:
    id: "settings-appearance"
- extendedWaitUntil:
    visible: "Choose how Patternly looks on this device."
    timeout: 30000
- tapOn: "^${THEME_LABEL},.*"
- tapOn: "Go back"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- assertVisible: ".*${THEME_LABEL}.*"
- tapOn:
    id: "main-tab-bar-home"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__010__home-ready__${THEME}__${DEVICE_PROFILE}"

- tapOn:
    id: "main-tab-bar-practice"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "patternly:practice:open-setup"
    direction: DOWN
    centerElement: true
    timeout: 30000
    visibilityPercentage: 50
- tapOn:
    id: "patternly:practice:open-setup"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:setup:root"
    timeout: 30000
- assertVisible:
    id: "patternly:practice:custom-setup-title"
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__020__custom-practice-setup-ready__${THEME}__${DEVICE_PROFILE}"
- scrollUntilVisible:
    element:
      id: "patternly:practice:start-session"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 50
- tapOn:
    id: "patternly:practice:start-session"
- extendedWaitUntil:
    visible:
      id: "patternly:session:root:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1"
    timeout: 30000
- assertVisible:
    id: "patternly:session:question:alg-complexity-amortized-001"
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__030__algorithms-active-session-ready__${THEME}__${DEVICE_PROFILE}"

- tapOn:
    id: "patternly:session:leave:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1"
- extendedWaitUntil:
    visible: "Pause or end this session?"
    timeout: 30000
- tapOn:
    id: "patternly:session:abandon:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1"
- extendedWaitUntil:
    visible:
      id: "patternly:summary:root:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__040__partial-session-summary-ready__${THEME}__${DEVICE_PROFILE}"

- tapOn:
    id: "patternly:summary:back-to-practice:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- assertVisible:
    id: "settings-appearance"
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__050__settings-root-ready__${THEME}__${DEVICE_PROFILE}"

- tapOn:
    id: "settings-appearance"
- extendedWaitUntil:
    visible: "Choose how Patternly looks on this device."
    timeout: 30000
- assertVisible: "^${THEME_LABEL},.*"
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__core__060__appearance-ready__${THEME}__${DEVICE_PROFILE}"
