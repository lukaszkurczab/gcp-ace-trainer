appId: com.lkurczab.patternly
name: Patternly visual shell — six stable checkpoints
tags:
  - screenshot
  - uiux-evidence
  - visual-shell
---
# Required environment: SCREENSHOT_ROOT, THEME, THEME_LABEL, DEVICE_PROFILE.
# The audit reset is the only fixture boundary; the remaining state is produced
# through the canonical learner journey.
- openLink: "com.lkurczab.patternly://audit/reset-learning-state"
- extendedWaitUntil:
    visible:
      id: "patternly:content:ready-after-audit-reset"
    timeout: 30000
- runFlow: visual-shell-capture.yaml
