appId: com.lkurczab.patternly
name: Patternly visual shell — track selection capture
tags:
  - screenshot
  - uiux-evidence
  - track-selection
---
# Capture the reachable selection variants without committing a different track.
- runFlow:
    when:
      visible:
        id: "patternly:home:select-track:root"
    commands:
      - scrollUntilVisible:
          element: "Go back"
          direction: UP
          centerElement: false
          timeout: 30000
      - tapOn: "Go back"
      - extendedWaitUntil:
          visible:
            id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
          timeout: 30000
- runFlow:
    when:
      visible: "Go back"
    commands:
      - tapOn: "Go back"
      - extendedWaitUntil:
          visible:
            id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
          timeout: 30000
- tapOn:
    id: "main-tab-bar-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- tapOn:
    id: "settings-appearance"
- extendedWaitUntil:
    visible: "Choose how Patternly looks on this device."
    timeout: 30000
- tapOn: "^${THEME_LABEL},.*"
- tapOn: "Go back"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-home"
- extendedWaitUntil:
    visible:
      id: "patternly:home:change-track"
    timeout: 30000
- tapOn:
    id: "patternly:home:change-track"
- extendedWaitUntil:
    visible: "Tracks"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__track-selection__top__${THEME}__${DEVICE_PROFILE}"
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:coding-interview-dsa-problem-solving"
    direction: DOWN
    centerElement: true
    timeout: 30000
    visibilityPercentage: 50
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__track-selection__coding-selected__${THEME}__${DEVICE_PROFILE}"
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
    direction: DOWN
    centerElement: true
    timeout: 30000
    visibilityPercentage: 50
- tapOn:
    id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
- takeScreenshot: "${SCREENSHOT_ROOT}/visual-shell__track-selection__cloud-selected__${THEME}__${DEVICE_PROFILE}"
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:coding-interview-dsa-problem-solving"
    direction: UP
    centerElement: true
    timeout: 30000
    visibilityPercentage: 50
- tapOn:
    id: "patternly:home:select-track:coding-interview-dsa-problem-solving"
- scrollUntilVisible:
    element: "Go back"
    direction: UP
    centerElement: false
    timeout: 30000
- tapOn: "Go back"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
