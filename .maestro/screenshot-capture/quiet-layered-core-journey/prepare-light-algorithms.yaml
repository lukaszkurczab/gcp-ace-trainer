appId: com.lkurczab.patternly
name: Patternly screenshot setup — light Algorithms
tags:
  - screenshot
  - uiux-evidence
---
- runFlow:
    when:
      visible:
        id: "BackButton"
    commands:
      - tapOn:
          point: "15%,10%"
- tapOn:
    id: "main-tab-bar-settings"
- extendedWaitUntil:
    visible:
      id: "settings-appearance"
    timeout: 30000
- tapOn:
    id: "settings-appearance"
- extendedWaitUntil:
    visible: "Light.*"
    timeout: 30000
- tapOn: "Light.*"
- tapOn:
    point: "15%,10%"
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-home"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-home"
- extendedWaitUntil:
    visible:
      id: "patternly:home:change-track"
    timeout: 30000
- tapOn:
    id: "patternly:home:change-track"
- extendedWaitUntil:
    visible: "Choose a track"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:coding-interview-dsa-problem-solving"
    direction: DOWN
    centerElement: false
    visibilityPercentage: 10
- tapOn:
    id: "patternly:home:select-track:coding-interview-dsa-problem-solving"
- extendedWaitUntil:
    visible:
      id: "patternly:home:change-track"
    timeout: 30000
