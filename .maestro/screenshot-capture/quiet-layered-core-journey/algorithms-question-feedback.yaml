appId: com.lkurczab.patternly
name: Patternly screenshot evidence — Algorithms question and feedback
tags:
  - screenshot
  - uiux-evidence
  - algorithms
---
- openLink: "com.lkurczab.patternly://audit/reset-learning-state"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:algorithms"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-practice"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "patternly:practice:mode-card:algorithms-independent-practice"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "patternly:practice:mode-card:algorithms-independent-practice"
- extendedWaitUntil:
    visible: "Choose a scope for Independent Practice"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/09__algorithms__010__scope-selection__ready__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"
- swipe:
    start: 50%, 75%
    end: 50%, 55%
    duration: 400
- tapOn: "Hash map and set.*"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-hms-complement-all-pairs-payload"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/10__algorithms__010__question__ready__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"
- scrollUntilVisible:
    element:
      id: "patternly:session:option:alg-hms-complement-all-pairs-payload:value_to_index_list"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 50
- tapOn:
    id: "patternly:session:option:alg-hms-complement-all-pairs-payload:value_to_index_list"
- tapOn:
    id: "patternly:session:submit:alg-hms-complement-all-pairs-payload"
- scrollUntilVisible:
    element:
      id: "patternly:session:result:alg-hms-complement-all-pairs-payload:correct"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 50
- takeScreenshot: "${SCREENSHOT_ROOT}/10__algorithms__020__feedback__correct__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"
- swipe:
    start: 50%, 60%
    end: 50%, 40%
    duration: 400
- swipe:
    start: 50%, 60%
    end: 50%, 40%
    duration: 400
- tapOn:
    id: "patternly:session:details-toggle:alg-hms-complement-all-pairs-payload"
- swipe:
    start: 50%, 60%
    end: 50%, 40%
    duration: 400
- swipe:
    start: 50%, 60%
    end: 50%, 40%
    duration: 400
- takeScreenshot: "${SCREENSHOT_ROOT}/10__algorithms__030__feedback-details__expanded__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"
- swipe:
    start: 50%, 60%
    end: 50%, 30%
    duration: 400
- takeScreenshot: "${SCREENSHOT_ROOT}/10__algorithms__040__feedback-details__lower-content__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"
- scrollUntilVisible:
    element:
      id: "patternly:session:leave:algorithms:algorithms-independent-practice:1"
    direction: UP
    centerElement: false
- tapOn:
    id: "patternly:session:leave:algorithms:algorithms-independent-practice:1"
- tapOn:
    id: "patternly:session:leave-and-resume:algorithms:algorithms-independent-practice:1"
