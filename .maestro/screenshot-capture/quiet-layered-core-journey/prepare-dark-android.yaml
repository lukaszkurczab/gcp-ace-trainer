appId: com.lkurczab.patternly
name: Patternly screenshot setup — dark Algorithms on Android
tags:
  - screenshot
  - uiux-evidence
---
- tapOn:
    id: "main-tab-bar-settings"
- extendedWaitUntil:
    visible:
      id: "settings-appearance"
    timeout: 30000
- tapOn:
    id: "settings-appearance"
- extendedWaitUntil:
    visible: "Dark.*"
    timeout: 30000
- tapOn: "Dark.*"
- back
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-home"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-home"
- extendedWaitUntil:
    visible:
      id: "patternly:home:change-track"
    timeout: 30000
- tapOn:
    id: "patternly:home:change-track"
- extendedWaitUntil:
    visible:
      id: "patternly:home:select-track:algorithms"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:algorithms"
    direction: UP
    centerElement: true
    visibilityPercentage: 50
- tapOn:
    id: "patternly:home:select-track:algorithms"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:algorithms"
    timeout: 30000
