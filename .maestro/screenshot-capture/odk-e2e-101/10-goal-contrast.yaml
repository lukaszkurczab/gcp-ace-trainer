appId: com.lkurczab.patternly
name: ODK-E2E-101 goal filled-label contrast
tags:
  - e2e
  - goal
  - screenshot
---
- launchApp:
    clearState: false
    stopApp: true
- openLink: ${PATTERNLY_DEV_CLIENT_URL}
- extendedWaitUntil:
    visible:
      id: "main-tab-bar"
    timeout: 30000
- tapOn:
    point: "86%,90%"
- scrollUntilVisible:
    element:
      id: "settings-goal"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-goal"
- scrollUntilVisible:
    element: "Active"
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: goal__contrast__010__active__light__en__ios-large
- scrollUntilVisible:
    element: "Pause goal"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Pause goal"
- scrollUntilVisible:
    element: "Paused"
    direction: UP
    centerElement: true
    timeout: 30000
- takeScreenshot: goal__contrast__020__paused__light__en__ios-large
- scrollUntilVisible:
    element: "Resume goal"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Resume goal"
- scrollUntilVisible:
    element: "Edit goal"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Edit goal"
- scrollUntilVisible:
    element:
      id: "patternly:goal:day:mon"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: "patternly:goal:day:mon"
    selected: true
- takeScreenshot: goal__contrast__030__selected-days__light__en__ios-large
- scrollUntilVisible:
    element: "Go back"
    direction: UP
    timeout: 30000
- tapOn: "Go back"
- tapOn: "^Settings$"
- scrollUntilVisible:
    element:
      id: "settings-language"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-language"
- tapOn:
    id: "language-option-pl"
- tapOn: "Wróć"
- scrollUntilVisible:
    element:
