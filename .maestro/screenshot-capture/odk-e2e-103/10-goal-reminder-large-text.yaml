appId: com.lkurczab.patternly
name: ODK-E2E-103 goal reminder large text
tags:
  - e2e
  - goal
  - accessibility
  - screenshot
---
- launchApp:
    clearState: false
    stopApp: true
- openLink: ${PATTERNLY_DEV_CLIENT_URL}
- extendedWaitUntil:
    visible:
      id: "main-tab-bar"
    timeout: 30000
- tapOn:
    point: "92%,93%"
- tapOn:
    id: "main-tab-bar-settings"
- scrollUntilVisible:
    element:
      id: "settings-language"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-language"
- tapOn:
    id: "language-option-en"
- tapOn: "Go back"
- scrollUntilVisible:
    element:
      id: "settings-goal"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-goal"
- scrollUntilVisible:
    element:
      id: "goal-summary-reminders"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: "goal-summary-reminders"
    enabled: true
- takeScreenshot: goal__reminder__010__settings__en__ios-max
- tapOn:
    id: "goal-summary-reminders"
- extendedWaitUntil:
    visible:
      id: "patternly:notifications:root"
    timeout: 30000
- tapOn: "Back to Goal"
- scrollUntilVisible:
    element: "Go back"
    direction: UP
    timeout: 30000
- tapOn: "Go back"
- tapOn:
    id: "main-tab-bar-progress"
- scrollUntilVisible:
    element:
      id: "patternly:progress:goal"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "patternly:progress:goal"
- scrollUntilVisible:
    element:
      id: "goal-summary-reminders"
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: goal__reminder__020__progress__en__ios-max
- scrollUntilVisible:
    element: "Go back"
    direction: UP
    timeout: 30000
- tapOn: "Go back"
- tapOn:
    id: "main-tab-bar-settings"
- scrollUntilVisible:
    element:
      id: "settings-language"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-language"
- tapOn:
    id: "language-option-pl"
- tapOn: "Wróć"
- scrollUntilVisible:
    element:
      id: "settings-goal"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "settings-goal"
- scrollUntilVisible:
    element:
      id: "goal-summary-reminders"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: "goal-summary-reminders"
    enabled: true
- takeScreenshot: goal__reminder__030__settings__pl__ios-max
- tapOn:
    id: "goal-summary-reminders"
- extendedWaitUntil:
    visible:
      id: "patternly:notifications:root"
    timeout: 30000
- tapOn: "Wróć do celu"
- scrollUntilVisible:
    element: "Wróć"
    direction: UP
    timeout: 30000
- tapOn: "Wróć"
- tapOn:
    id: "main-tab-bar-progress"
- scrollUntilVisible:
    element:
      id: "patternly:progress:goal"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "patternly:progress:goal"
- scrollUntilVisible:
    element:
      id: "goal-summary-reminders"
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: goal__reminder__040__progress__pl__ios-max
