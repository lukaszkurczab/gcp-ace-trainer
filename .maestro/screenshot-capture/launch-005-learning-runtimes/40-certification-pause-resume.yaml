appId: com.lkurczab.patternly
name: Patternly launch 005 — Certification pause and exact resume evidence
tags:
  - screenshot
  - uiux-evidence
  - launch-005
  - certification
  - recovery
---
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- assertVisible:
    id: "patternly:home:change-track"
- tapOn:
    id: "patternly:home:change-track"
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 50
    timeout: 30000
- tapOn:
    id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:google-cloud-associate-cloud-engineer"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-practice"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "patternly:practice:mode-card:certification-focus-practice"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "patternly:practice:mode-card:certification-focus-practice"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:setup:root"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "patternly:practice:focus-topic:setup_environment"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "patternly:practice:focus-topic:setup_environment"
- scrollUntilVisible:
    element:
      id: "patternly:practice:session-length:10"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "patternly:practice:session-length:10"
- scrollUntilVisible:
    element:
      id: "patternly:practice:start-session"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "patternly:practice:start-session"

- extendedWaitUntil:
    visible:
      id: "patternly:session:root:google-cloud-associate-cloud-engineer:certification-focus-practice:1"
    timeout: 30000
- assertVisible:
    id: "patternly:session:question:ace-q-0001"
- assertVisible:
    id: "patternly:session:counter:google-cloud-associate-cloud-engineer:certification-focus-practice:1:ordinal:1:length:10"
- scrollUntilVisible:
    element:
      id: "patternly:session:option:ace-q-0001:a"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 50
- tapOn:
    id: "patternly:session:option:ace-q-0001:a"
- scrollUntilVisible:
    element:
      id: "patternly:session:submit:ace-q-0001"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "patternly:session:submit:ace-q-0001"
- scrollUntilVisible:
    element:
      id: "patternly:session:feedback:ace-q-0001"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 50
- assertVisible:
    id: "patternly:session:result:ace-q-0001:correct"
- assertVisible:
    id: "patternly:session:reason:ace-q-0001"
- scrollUntilVisible:
    element:
      id: "patternly:session:leave:google-cloud-associate-cloud-engineer:certification-focus-practice:1"
    direction: DOWN
    centerElement: false
    timeout: 30000
- tapOn:
    id: "patternly:session:leave:google-cloud-associate-cloud-engineer:certification-focus-practice:1"
- extendedWaitUntil:
    visible: "Pause or end this session?"
    timeout: 30000
- assertVisible:
    id: "patternly:session:leave-and-resume:google-cloud-associate-cloud-engineer:certification-focus-practice:1"
- takeScreenshot: "${SCREENSHOT_ROOT}/learning-runtime__certification-pause-resume__010__pause-modal__${THEME}__${PLATFORM}-phone"
- tapOn:
    id: "patternly:session:leave-and-resume:google-cloud-associate-cloud-engineer:certification-focus-practice:1"

- extendedWaitUntil:
    visible:
      id: "patternly:practice:setup:root"
    timeout: 30000
- tapOn: "Go back"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-home"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:google-cloud-associate-cloud-engineer"
    timeout: 30000
- killApp
- launchApp
- openLink: "${PATTERNLY_DEV_CLIENT_URL}"
- scrollUntilVisible:
    element:
      id: "patternly:resume:card:google-cloud-associate-cloud-engineer:certification-focus-practice:1"
    direction: DOWN
    centerElement: false
    visibilityPercentage: 20
    timeout: 30000
- assertVisible:
    id: "patternly:resume:title:google-cloud-associate-cloud-engineer:certification-focus-practice:1"
- assertVisible:
    id: "patternly:resume:status:google-cloud-associate-cloud-engineer:certification-focus-practice:1"
- assertVisible:
    id: "patternly:resume:continue:google-cloud-associate-cloud-engineer:certification-focus-practice:1"
- takeScreenshot: "${SCREENSHOT_ROOT}/learning-runtime__certification-pause-resume__020__resume-card__${THEME}__${PLATFORM}-phone"
- tapOn:
    id: "patternly:resume:continue:google-cloud-associate-cloud-engineer:certification-focus-practice:1"

- extendedWaitUntil:
    visible:
      id: "patternly:session:root:google-cloud-associate-cloud-engineer:certification-focus-practice:1"
    timeout: 30000
- assertVisible:
    id: "patternly:session:question:ace-q-0001"
- assertVisible:
    id: "patternly:session:counter:google-cloud-associate-cloud-engineer:certification-focus-practice:1:ordinal:1:length:10"
- scrollUntilVisible:
    element:
      id: "patternly:session:feedback:ace-q-0001"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 50
- assertVisible:
    id: "patternly:session:result:ace-q-0001:correct"
- assertVisible:
    id: "patternly:session:reason:ace-q-0001"
- takeScreenshot: "${SCREENSHOT_ROOT}/learning-runtime__certification-pause-resume__030__resumed-feedback__${THEME}__${PLATFORM}-phone"
