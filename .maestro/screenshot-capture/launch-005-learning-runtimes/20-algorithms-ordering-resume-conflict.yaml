- takeScreenshot: "${SCREENSHOT_ROOT}/learning-runtime__algorithms-ordering-resume-conflict__040__pause-route-exit__${THEME}__${PLATFORM}-phone"

- killApp
- launchApp
- openLink: "${PATTERNLY_DEV_CLIENT_URL}"
- scrollUntilVisible:
