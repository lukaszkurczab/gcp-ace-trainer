    timeout: 30000
    visibilityPercentage: 50
- tapOn:
    id: "patternly:practice:start-session"
- extendedWaitUntil:
    visible: "Finish or leave the active session first"
    timeout: 30000
- assertVisible: "Resume Independent Practice"
- takeScreenshot: "${SCREENSHOT_ROOT}/learning-runtime__algorithms-ordering-resume-conflict__070__active-session-conflict__${THEME}__${PLATFORM}-phone"
- tapOn: "Abandon and start Guided Practice"
- extendedWaitUntil:
    visible: "Abandon active session?"
    timeout: 30000
- assertVisible: "Keep session"
- takeScreenshot: "${SCREENSHOT_ROOT}/learning-runtime__algorithms-ordering-resume-conflict__080__destructive-confirmation__${THEME}__${PLATFORM}-phone"
- tapOn: "Keep session"
