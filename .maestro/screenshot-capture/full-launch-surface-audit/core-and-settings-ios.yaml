appId: com.lkurczab.patternly
name: Patternly full launch surface audit — iOS core and settings
tags:
  - screenshot
  - uiux-evidence
  - launch-surface-audit
---
- openLink: "com.lkurczab.patternly://audit/reset-learning-state"
- extendedWaitUntil:
    visible:
      id: "patternly:home:change-track"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/01__entry__010__home-current-track__light__ios-regular.png"

- tapOn:
    id: "patternly:home:change-track"
- extendedWaitUntil:
    visible: "Choose a track"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/02__onboarding-selection__010__track-selection__light__ios-regular.png"
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:algorithms"
    direction: DOWN
    centerElement: false
    visibilityPercentage: 20
- tapOn:
    id: "patternly:home:select-track:algorithms"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:algorithms"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/03__entry__010__algorithms-home__light__ios-regular.png"

- tapOn:
    id: "main-tab-bar-practice"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/04__practice__010__algorithms-hub__light__ios-regular.png"

- tapOn:
    id: "patternly:practice:open-setup"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:setup:root"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/05__practice__010__custom-setup__light__ios-regular.png"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000

- tapOn:
    id: "patternly:practice:start-session"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-001"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/06__session__010__question__light__ios-regular.png"
- tapOn:
    id: "patternly:session:leave:algorithms:algorithms-guided-practice:1"
- extendedWaitUntil:
    visible: "Pause or end this session?"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/06__session__020__exit-decision__light__ios-regular.png"
- tapOn:
    id: "patternly:session:abandon:algorithms:algorithms-guided-practice:1"
- extendedWaitUntil:
    visible:
      id: "patternly:summary:root:algorithms:algorithms-guided-practice:1"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/07__summary__010__partial-summary__light__ios-regular.png"
- tapOn:
    id: "patternly:summary:back-to-practice:algorithms:algorithms-guided-practice:1"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000

- tapOn:
    id: "main-tab-bar-progress"
- extendedWaitUntil:
    visible:
      id: "patternly:progress:root"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/08__progress__010__algorithms-priority__light__ios-regular.png"

- tapOn:
    id: "main-tab-bar-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/09__settings__010__settings-root__light__ios-regular.png"

- tapOn:
    id: "settings-appearance"
- extendedWaitUntil:
    visible: "Choose how Patternly looks on this device."
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/10__settings__010__appearance__light__ios-regular.png"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000

- tapOn:
    id: "settings-language"
- extendedWaitUntil:
    visible: "Patternly currently uses English for both the interface and learning content."
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/11__settings__010__language__light__ios-regular.png"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000

- tapOn:
    id: "settings-notifications"
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/12__settings__010__notifications__light__ios-regular.png"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000

- scrollUntilVisible:
    element:
      id: "settings-your-data"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "settings-your-data"
- extendedWaitUntil:
    visible: "Your learning data"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/13__settings__010__your-data__light__ios-regular.png"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000

- scrollUntilVisible:
    element:
      id: "settings-legal-information"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "settings-legal-information"
- extendedWaitUntil:
    visible: "Legal information"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/14__settings__010__legal-information__light__ios-regular.png"
