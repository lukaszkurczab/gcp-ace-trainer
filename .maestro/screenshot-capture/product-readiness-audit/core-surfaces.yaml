appId: com.lkurczab.patternly
name: Patternly product readiness audit — core surfaces
tags:
  - screenshot
  - uiux-evidence
  - product-readiness
---
- openLink: "com.lkurczab.patternly://audit/reset-learning-state"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/01__entry__010__home__ready__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"

- tapOn:
    id: "patternly:home:change-track"
- extendedWaitUntil:
    visible: "Choose a track"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/02__track-selection__010__portfolio__ready__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"
- tapOn:
    id: "patternly:home:select-track:coding-interview-dsa-problem-solving"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000

- tapOn:
    id: "main-tab-bar-practice"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/03__practice__010__hub__ready__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"

- tapOn:
    id: "patternly:practice:open-setup"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:setup:root"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/04__configuration__010__custom-practice__ready__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000

- tapOn:
    id: "patternly:practice:start-session"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-amortized-001"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/05__session__010__recommended-start__ready__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"
- tapOn:
    id: "patternly:session:leave:coding-interview-dsa-problem-solving:coding-interview-guided-practice:1"
- extendedWaitUntil:
    visible: "Pause or end this session?"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/05__session__020__exit-choice__ready__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"
- tapOn:
    id: "patternly:session:abandon:coding-interview-dsa-problem-solving:coding-interview-guided-practice:1"
- extendedWaitUntil:
    visible:
      id: "patternly:summary:root:coding-interview-dsa-problem-solving:coding-interview-guided-practice:1"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/06__summary__010__partial__ready__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"
- tapOn:
    id: "patternly:summary:back-to-practice:coding-interview-dsa-problem-solving:coding-interview-guided-practice:1"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000

- tapOn:
    id: "main-tab-bar-progress"
- extendedWaitUntil:
    visible:
      id: "patternly:progress:root"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/07__progress__010__learning-priority__ready__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"

- tapOn:
    id: "main-tab-bar-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- takeScreenshot: "${SCREENSHOT_ROOT}/08__settings__010__preferences__ready__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"
- swipe:
    direction: UP
- takeScreenshot: "${SCREENSHOT_ROOT}/08__settings__020__data-and-legal__ready__${PLATFORM}__${THEME}__${LOCALE}__${TEXT_SIZE}"
