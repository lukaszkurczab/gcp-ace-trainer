appId: com.lkurczab.gcpacetrainer
name: T30 active simulation reference capture
tags:
  - screenshot
  - uiux-evidence
  - algorithms-stage3
---
# Captures a real active Algorithms simulation from the persisted home screen.
- openLink: "com.lkurczab.gcpacetrainer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- waitForAnimationToEnd:
    timeout: 12000
- tapOn:
    id: "patternly:home:change-track"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: "t30__010__track-selection"
- tapOn:
    point: "70%,85%"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: "t30__020__algorithms-home"
- tapOn: "Practice"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: "t30__030__practice-hub"
- scrollUntilVisible:
    element:
      id: "patternly:practice:mode-card:algorithms-interview-simulation"
    direction: DOWN
- tapOn:
    id: "patternly:practice:mode-card:algorithms-interview-simulation"
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: "t30__040__active-simulation"
