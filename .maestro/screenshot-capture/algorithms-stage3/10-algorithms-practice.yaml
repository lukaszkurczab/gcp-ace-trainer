appId: com.lkurczab.gcpacetrainer
name: Algorithms Practice real-session capture
tags:
  - screenshot
  - uiux-evidence
  - algorithms-stage3
---
# Continues through real navigation and the bundled Algorithms artifact.
- openLink: "com.lkurczab.gcpacetrainer://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- waitForAnimationToEnd:
    timeout: 12000
- tapOn: "Choose track"
- waitForAnimationToEnd:
    timeout: 12000
# The Algorithms action is the lower start-track control in the actual track list.
- tapOn:
    point: "70%,85%"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: "algorithms-stage3__practice__010__algorithms-home__dark__ios-regular"
- tapOn: "Practice"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: "algorithms-stage3__practice__020__practice-hub__dark__ios-regular"
- tapOn: "Start session"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: "algorithms-stage3__practice__030__active-unanswered__dark__ios-regular"
