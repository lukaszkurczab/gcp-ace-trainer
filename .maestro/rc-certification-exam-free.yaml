appId: com.lkurczab.patternly
name: Patternly RC — Free Certification Exam paywall and cold restart
tags:
  - rc-evidence
  - certification
  - free
---
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- runFlow:
    when:
      visible:
        id: "patternly:home:select-track:root"
    commands:
      - scrollUntilVisible:
          element:
            id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
          direction: DOWN
          centerElement: true
      - tapOn:
          id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
      - tapOn:
          id: "patternly:home:select-track:continue"
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-home"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "patternly:home:change-track"
    commands:
      - tapOn:
          id: "patternly:home:change-track"
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
      - extendedWaitUntil:
          notVisible: ".*Open debugger to view warnings.*"
          timeout: 5000
- tapOn:
    id: "patternly:home:select-track:continue"
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- tapOn:
    id: "patternly:home:primary-action"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "patternly:practice:mode-card:certification-exam-simulation"
    direction: DOWN
- takeScreenshot: "rc-certification-exam-free-offer"
- tapOn:
    id: "patternly:practice:mode-card:certification-exam-simulation"
- extendedWaitUntil:
    visible:
      id: "premium-offer-summary"
    timeout: 30000
- takeScreenshot: "rc-certification-exam-free-paywall"
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-home"
    timeout: 30000
- tapOn:
    id: "patternly:home:primary-action"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "patternly:practice:mode-card:certification-exam-simulation"
    direction: DOWN
- tapOn:
    id: "patternly:practice:mode-card:certification-exam-simulation"
- extendedWaitUntil:
    visible:
      id: "premium-offer-summary"
    timeout: 30000
- takeScreenshot: "rc-certification-exam-free-paywall-after-restart"
