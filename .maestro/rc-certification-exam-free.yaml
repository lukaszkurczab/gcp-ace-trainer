appId: com.lkurczab.patternly
name: Patternly RC — Free Certification Exam paywall and cold restart
tags:
  - rc-evidence
  - certification
  - free
---
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-settings"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-settings"
- runFlow:
    when:
      visible:
        id: "settings-account-entry"
    commands:
      - tapOn:
          id: "settings-account-entry"
- runFlow:
    when:
      visible:
        id: "account-sign-in"
    commands:
      - tapOn:
          id: "account-sign-in"
- runFlow:
    when:
      visible:
        id: "account-email"
    commands:
      - tapOn:
          id: "account-email"
      - inputText: "${EXPO_PUBLIC_PATTERNLY_E2E_EMAIL}"
      - tapOn:
          id: "account-password"
      - inputText: "${EXPO_PUBLIC_PATTERNLY_E2E_PASSWORD}"
      - tapOn:
          id: "account-sign-in-submit"
      - extendedWaitUntil:
          notVisible:
            id: "account-email"
          timeout: 30000
- runFlow:
    when:
      visible:
        id: "account-entry-continue"
    commands:
      - tapOn:
          id: "account-entry-continue"
      - extendedWaitUntil:
          notVisible:
            id: "account-entry-continue"
          timeout: 30000
- runFlow:
    when:
      visible:
        id: "account-open-settings"
    commands:
      - tapOn:
          id: "account-open-settings"
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-home"
    timeout: 30000
- tapOn:
    id: "main-tab-bar-home"
- runFlow:
    when:
      visible:
        id: "patternly:home:change-track"
    commands:
      - tapOn:
          id: "patternly:home:change-track"
- scrollUntilVisible:
    element:
      id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "patternly:home:select-track:google-cloud-associate-cloud-engineer"
- tapOn: "Go back"
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- tapOn:
    id: "patternly:home:primary-action"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "patternly:practice:mode-card:certification-exam-simulation"
    direction: DOWN
- takeScreenshot: "rc-certification-exam-free-offer"
- tapOn:
    id: "patternly:practice:mode-card:certification-exam-simulation"
- extendedWaitUntil:
    visible:
      id: "premium-offer-summary"
    timeout: 30000
- takeScreenshot: "rc-certification-exam-free-paywall"
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "main-tab-bar-home"
    timeout: 30000
- tapOn:
    id: "patternly:home:primary-action"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "patternly:practice:mode-card:certification-exam-simulation"
    direction: DOWN
- tapOn:
    id: "patternly:practice:mode-card:certification-exam-simulation"
- extendedWaitUntil:
    visible:
      id: "premium-offer-summary"
    timeout: 30000
- takeScreenshot: "rc-certification-exam-free-paywall-after-restart"
