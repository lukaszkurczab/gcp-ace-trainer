appId: com.lkurczab.patternly
name: UI-26-02B provisional cancel retry ${PROVIDER}
---
- assertVisible:
    id: provider-registration-review
- tapOn:
    id: provider-registration-cancel
- extendedWaitUntil:
    visible:
      id: account-sign-in-submit
    timeout: 30000
- assertNotVisible:
    id: provider-registration-review
- openLink: 'com.lkurczab.patternly://audit/provider-auth?runId=${RUN_ID}&provider=${PROVIDER}&scenario=unmapped'
- extendedWaitUntil:
    visible:
      id: provider-auth-fixture-active
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'account-provider-${PROVIDER}'
    direction: DOWN
- tapOn:
    id: 'account-provider-${PROVIDER}'
- extendedWaitUntil:
    visible:
      id: provider-registration-review
    timeout: 30000
- assertVisible:
    id: provider-registration-terms-checkbox
    text: 'checkbox, unchecked'
    enabled: false
- assertVisible:
    id: provider-registration-privacy-checkbox
    text: 'checkbox, unchecked'
    enabled: false
- assertVisible:
    id: provider-registration-create
    enabled: false
- takeScreenshot: cancel-retry-reset-consent
- tapOn:
    id: provider-registration-cancel
- extendedWaitUntil:
    visible:
      id: account-sign-in-submit
    timeout: 30000
- tapOn:
    id: account-sign-in-guest
- extendedWaitUntil:
    visible:
      id: main-tab-bar-home
    timeout: 30000
- assertVisible: '.*Complexity and constraints.*'
- takeScreenshot: canceled-provider-guest-plan-retained
