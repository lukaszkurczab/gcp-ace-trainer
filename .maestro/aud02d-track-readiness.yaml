appId: com.lkurczab.patternly
name: Patternly AUD-02D - track readiness
tags:
  - runtime-auditability
  - aud-02d
  - track-readiness
---
- runFlow:
    when:
      visible:
        id: "patternly:home:select-track:root"
    commands:
      - scrollUntilVisible:
          element:
            id: "patternly:home:select-track:${TRACK_ID}"
          direction: DOWN
          centerElement: true
      - tapOn:
          id: "patternly:home:select-track:${TRACK_ID}"
      - runFlow:
          when:
            visible: ".*Open debugger to view warnings.*"
          commands:
            - tapOn:
                point: "92%,93%"
            - extendedWaitUntil:
                notVisible: ".*Open debugger to view warnings.*"
                timeout: 5000
      - runFlow:
          when:
            visible:
              id: "patternly:home:select-track:continue"
          commands:
            - tapOn:
                id: "patternly:home:select-track:continue"
            - extendedWaitUntil:
                notVisible:
                  id: "patternly:home:select-track:root"
                timeout: 30000
      - runFlow:
          when:
            visible:
              id: "patternly:home:select-track:root"
          commands:
            - tapOn: "Go back"
- runFlow:
    when:
      visible:
        id: "main-tab-bar-home"
    commands:
      - tapOn:
          id: "main-tab-bar-home"
- runFlow:
    when:
      visible:
        id: "patternly:home:change-track"
    commands:
      - tapOn:
          id: "patternly:home:change-track"
- extendedWaitUntil:
    visible:
      id: "patternly:home:select-track:${TRACK_ID}"
    timeout: 30000
- tapOn:
    id: "patternly:home:select-track:${TRACK_ID}"
    point: "50%,25%"
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
      - extendedWaitUntil:
          notVisible: ".*Open debugger to view warnings.*"
          timeout: 5000
- runFlow:
    when:
      visible:
        id: "patternly:home:select-track:continue"
    commands:
      - tapOn:
          id: "patternly:home:select-track:continue"
      - extendedWaitUntil:
          notVisible:
            id: "patternly:home:select-track:root"
          timeout: 30000
- runFlow:
    when:
      visible:
        id: "patternly:home:select-track:root"
    commands:
      - tapOn: "Go back"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:${TRACK_ID}"
    timeout: 30000
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- runFlow:
    when:
      visible: "Nie teraz"
    commands:
      - tapOn: "Nie teraz"
- tapOn:
    id: "main-tab-bar-practice"
- extendedWaitUntil:
    visible:
      id: "patternly:practice:hub:root"
    timeout: 30000
- assertVisible:
    id: "patternly:practice:open-setup"
- takeScreenshot: "aud02d-track-ready-${TRACK_ID}"
