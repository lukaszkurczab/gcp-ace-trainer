appId: com.lkurczab.patternly
name: Patternly M5 — Completed session never resumes after relaunch
tags:
  - runtime-auditability
  - m5
---
- runFlow: m1-guided-10.yaml
- killApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- assertNotVisible:
    id: "patternly:resume:card:coding-interview-dsa-problem-solving:coding-interview-guided-practice:1"
- assertNotVisible:
    id: "patternly:session:root:coding-interview-dsa-problem-solving:coding-interview-guided-practice:1"
- tapOn:
    id: "main-tab-bar-practice"
- assertVisible:
    id: "patternly:practice:hub:root"
