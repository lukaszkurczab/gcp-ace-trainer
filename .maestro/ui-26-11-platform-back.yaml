appId: com.lkurczab.patternly
name: UI-26-11 production proposal platform Back
---
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: main-tab-bar-settings
      - extendedWaitUntil:
          visible:
            id: settings-screen
          timeout: 5000
- scrollUntilVisible:
    element:
      id: settings-goal
    direction: DOWN
- tapOn:
    id: settings-goal
- scrollUntilVisible:
    element:
      id: patternly:learning-plan:create
    direction: DOWN
- tapOn:
    id: patternly:learning-plan:create
- extendedWaitUntil:
    visible:
      id: patternly:learning-plan:accept
    timeout: 15000
- swipe:
    start: '1%, 48%'
    end: '95%, 48%'
    duration: 600
- extendedWaitUntil:
    visible:
      id: patternly:learning-plan:create
    timeout: 10000
- assertNotVisible:
    id: patternly:learning-plan:accept
- takeScreenshot: real-platform-back
- tapOn:
    text: Go back
    index: 0
