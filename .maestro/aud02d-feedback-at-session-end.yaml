appId: com.lkurczab.patternly
name: Patternly AUD-02D - complete at-session-end feedback lifecycle
tags:
  - runtime-auditability
  - aud-02d
  - custom-practice
---
- assertVisible:
    id: "patternly:practice:hub:root"
- assertVisible:
    id: "main-tab-bar-home"
- tapOn:
    id: "main-tab-bar-home"
- extendedWaitUntil:
    visible:
      id: "patternly:home:track-card:coding-interview-dsa-problem-solving"
    timeout: 30000
- runFlow: m3-custom-at-session-end.yaml
- assertVisible:
    id: "patternly:session:counter:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1:ordinal:2:length:10"
- assertVisible:
    id: "patternly:session:configuration:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1:length:10:feedback-timing:at-session-end"
- assertVisible:
    id: "patternly:session:question:alg-complexity-output-001"
- tapOn:
    id: "patternly:session:option:alg-complexity-output-001:omega_k"
- tapOn:
    id: "patternly:session:submit:alg-complexity-output-001"
- assertNotVisible:
    id: "patternly:session:feedback:alg-complexity-output-001"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-preprocess-001"
    timeout: 30000
- assertVisible:
    id: "patternly:session:question:alg-complexity-preprocess-001"
- tapOn:
    id: "patternly:session:option:alg-complexity-preprocess-001:p_plus_q"
- tapOn:
    id: "patternly:session:submit:alg-complexity-preprocess-001"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-reject-001"
    timeout: 30000
- assertVisible:
    id: "patternly:session:question:alg-complexity-reject-001"
- tapOn:
    id: "patternly:session:option:alg-complexity-reject-001:avoid_wrong_growth"
- tapOn:
    id: "patternly:session:submit:alg-complexity-reject-001"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-review-001"
    timeout: 30000
- assertVisible:
    id: "patternly:session:question:alg-complexity-review-001"
- tapOn:
    id: "patternly:session:option:alg-complexity-review-001:executed_work"
- tapOn:
    id: "patternly:session:submit:alg-complexity-review-001"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-scaling-001"
    timeout: 30000
- assertVisible:
    id: "patternly:session:question:alg-complexity-scaling-001"
- tapOn:
    id: "patternly:session:option:alg-complexity-scaling-001:model_dependent"
- tapOn:
    id: "patternly:session:submit:alg-complexity-scaling-001"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-space-001"
    timeout: 30000
- assertVisible:
    id: "patternly:session:question:alg-complexity-space-001"
- tapOn:
    id: "patternly:session:option:alg-complexity-space-001:working_memory"
- tapOn:
    id: "patternly:session:submit:alg-complexity-space-001"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-time-001"
    timeout: 30000
- assertVisible:
    id: "patternly:session:question:alg-complexity-time-001"
- tapOn:
    id: "patternly:session:option:alg-complexity-time-001:linear"
- tapOn:
    id: "patternly:session:submit:alg-complexity-time-001"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-time-002"
    timeout: 30000
- assertVisible:
    id: "patternly:session:question:alg-complexity-time-002"
- tapOn:
    id: "patternly:session:option:alg-complexity-time-002:product"
- tapOn:
    id: "patternly:session:submit:alg-complexity-time-002"
- extendedWaitUntil:
    visible:
      id: "patternly:session:question:alg-complexity-output-002"
    timeout: 30000
- assertVisible:
    id: "patternly:session:question:alg-complexity-output-002"
- tapOn:
    id: "patternly:session:option:alg-complexity-output-002:different_contract"
- tapOn:
    id: "patternly:session:submit:alg-complexity-output-002"
- extendedWaitUntil:
    visible:
      id: "patternly:summary:root:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1"
    timeout: 30000
- assertVisible:
    id: "patternly:summary:configuration:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1:10:at-session-end"
- assertNotVisible:
    id: "patternly:session:counter:coding-interview-dsa-problem-solving:coding-interview-custom-practice:1:ordinal:11:length:10"
- takeScreenshot: "aud02d-custom-feedback-result-at-session-end"
- runFlow: coding-practice-result-review.yaml
