name: QA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa-static:
    name: Recovery QA gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0
      - id: content-lock
        name: Read immutable content lock
        working-directory: app
        shell: bash
        run: |
          node -e '
            const lock = require("./integration/contracts/algorithms-content/content.lock.json");
            if (lock.schemaVersion !== 1 || lock.repository !== "lukaszkurczab/patternly-content" || !/^[a-f0-9]{40}$/.test(lock.commit)) process.exit(1);
            process.stdout.write(`commit=${lock.commit}\n`);
          ' >> "$GITHUB_OUTPUT"
      - name: Checkout locked content producer
        uses: actions/checkout@v4
        with:
          repository: lukaszkurczab/patternly-content
          ref: ${{ steps.content-lock.outputs.commit }}
          path: patternly-content
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install application dependencies
        working-directory: app
        run: npm ci
      - name: Enforce canonical contract change gate
        working-directory: app
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD^"
          fi
          npm run gate:contract-change -- "$range"
      - name: Run recovery baseline (includes qa:static)
        working-directory: app
        env:
          PATTERNLY_CONTENT_ROOT: ${{ github.workspace }}/patternly-content
        run: npm run baseline:report

  algorithms-cross-repository-contract:
    name: Algorithms cross-repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app
      - id: content-lock
        name: Read immutable content lock
        working-directory: app
        shell: bash
        run: |
          node -e '
            const lock = require("./integration/contracts/algorithms-content/content.lock.json");

            if (
              lock.schemaVersion !== 1 ||
              lock.repository !== "lukaszkurczab/patternly-content" ||
              !/^[a-f0-9]{40}$/.test(lock.commit) ||
              lock.taxonomyVersion !== "algorithms-taxonomy-v2" ||
              !/^[a-f0-9]{64}$/.test(lock.taxonomyFingerprint)
            ) {
              process.exit(1);
            }

            process.stdout.write(`commit=${lock.commit}\n`);
          ' >> "$GITHUB_OUTPUT"
      - name: Checkout locked content producer
        uses: actions/checkout@v4
        with:
          repository: lukaszkurczab/patternly-content
          ref: ${{ steps.content-lock.outputs.commit }}
          path: patternly-content
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install application dependencies
        working-directory: app
        run: npm ci
      - name: Run pinned cross-repository round-trip
        working-directory: app
        env:
          PATTERNLY_CONTENT_ROOT: ${{ github.workspace }}/patternly-content
        run: npm run test:algorithms-cross-repo
