name: QA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa-static:
    name: Recovery QA gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0
      - id: content-lock
        name: Read immutable content lock
        working-directory: app
        shell: bash
        run: |
          content_producer_pin="$(node scripts/candidateContentReleaseLock.mjs producer-pin)"
          historical_producer_pin="$(node scripts/candidateContentReleaseLock.mjs historical-producer-pin)"
          printf 'commit=%s\nhistorical-commit=%s\n' "$content_producer_pin" "$historical_producer_pin" >> "$GITHUB_OUTPUT"
      - name: Checkout locked content producer
        uses: actions/checkout@v4
        with:
          repository: lukaszkurczab/patternly-content
          ref: ${{ steps.content-lock.outputs.historical-commit }}
          path: patternly-content-historical
          fetch-depth: 0
      - name: Checkout current content producer
        uses: actions/checkout@v4
        with:
          repository: lukaszkurczab/patternly-content
          ref: master
          path: patternly-content
          fetch-depth: 0
      - id: current-content
        name: Record exact current and historical content inputs
        shell: bash
        env:
          EXPECTED_HISTORICAL_CONTENT_SHA: ${{ steps.content-lock.outputs.historical-commit }}
          EXPECTED_CANDIDATE_SOURCE_SHA: ${{ steps.content-lock.outputs.commit }}
        run: |
          current_content_sha="$(git -C "$GITHUB_WORKSPACE/patternly-content" rev-parse HEAD)"
          historical_content_sha="$(git -C "$GITHUB_WORKSPACE/patternly-content-historical" rev-parse HEAD)"
          [[ "$current_content_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$historical_content_sha" == "$EXPECTED_HISTORICAL_CONTENT_SHA" ]]
          git -C "$GITHUB_WORKSPACE/patternly-content" cat-file -e "${EXPECTED_CANDIDATE_SOURCE_SHA}^{commit}"
          printf 'Current content input: %s\nHistorical content input: %s\n' "$current_content_sha" "$historical_content_sha"
          printf 'sha=%s\nhistorical-sha=%s\n' "$current_content_sha" "$historical_content_sha" >> "$GITHUB_OUTPUT"
      - name: Verify candidate-bound content release lock
        working-directory: app
        run: node scripts/candidateContentReleaseLock.mjs check
      - name: Checkout current backend QA input
        uses: actions/checkout@v4
        with:
          repository: lukaszkurczab/patternly-backend
          ref: main
          path: patternly-backend
          fetch-depth: 0
      - id: current-backend
        name: Record exact backend QA input
        shell: bash
        run: |
          backend_sha="$(git -C "$GITHUB_WORKSPACE/patternly-backend" rev-parse HEAD)"
          [[ "$backend_sha" =~ ^[a-f0-9]{40}$ ]]
          printf 'Current backend QA input: %s\n' "$backend_sha"
          printf 'sha=%s\n' "$backend_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            patternly-backend/package-lock.json
      - name: Install application dependencies
        working-directory: app
        run: npm ci
      - name: Install backend QA dependencies
        working-directory: patternly-backend
        run: npm ci
      - name: Verify clean generated native platform contract
        working-directory: app
        env:
          PATTERNLY_RUNTIME_MODE: smoke
          EXPO_PUBLIC_PATTERNLY_RUNTIME_MODE: smoke
          EXPO_PUBLIC_PATTERNLY_BACKEND_E2E: "true"
          EXPO_PUBLIC_PATTERNLY_API_ORIGIN: http://127.0.0.1:8080
          EXPO_PUBLIC_PATTERNLY_FIREBASE_AUTH_EMULATOR_ORIGIN: http://127.0.0.1:19099
        shell: bash
        run: |
          prebuild_root="$(mktemp -d)"
          trap 'rm -rf "$prebuild_root"' EXIT
          git archive HEAD | tar -x -C "$prebuild_root"
          ln -s "$GITHUB_WORKSPACE/app/node_modules" "$prebuild_root/node_modules"
          (
            cd "$prebuild_root"
            npx expo prebuild --no-install --clean
            node -e '
              const { readFileSync } = require("node:fs");
              const android = readFileSync("android/gradle.properties", "utf8");
              for (const expected of ["android.minSdkVersion=28", "android.compileSdkVersion=36", "android.targetSdkVersion=36"]) if (!android.includes(expected)) process.exit(1);
              const ios = JSON.parse(readFileSync("ios/Podfile.properties.json", "utf8"));
              if (ios["ios.deploymentTarget"] !== "16.4") process.exit(1);
              const infoPlist = readFileSync("ios/Patternly/Info.plist", "utf8");
              for (const expected of ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown", "UIUserInterfaceStyle", "<string>Automatic</string>"]) if (!infoPlist.includes(expected)) process.exit(1);
              if (!readFileSync("ios/Patternly.xcodeproj/project.pbxproj", "utf8").includes("TARGETED_DEVICE_FAMILY = \"1\"")) process.exit(1);
              const appDelegate = readFileSync("ios/Patternly/AppDelegate.swift", "utf8");
              for (const expected of ["appendingPathComponent(\"mmkv\", isDirectory: true)", "values.isExcludedFromBackup = true"]) if (!appDelegate.includes(expected)) process.exit(1);
              const manifest = readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
              for (const expected of ["android:allowBackup=\"false\"", "android:dataExtractionRules=\"@xml/data_extraction_rules\"", "android:fullBackupContent=\"@xml/backup_rules\""]) if (!manifest.includes(expected)) process.exit(1);
              for (const path of ["android/app/src/main/res/xml/backup_rules.xml", "android/app/src/main/res/xml/data_extraction_rules.xml"]) if (!readFileSync(path, "utf8").includes("<exclude domain=\"root\" path=\".\"/>")) process.exit(1);
            '
          )
      - name: Run recovery baseline (includes qa:static)
        working-directory: app
        env:
          PATTERNLY_CONTENT_ROOT: ${{ github.workspace }}/patternly-content
          PATTERNLY_CONTENT_CURRENT_ROOT: ${{ github.workspace }}/patternly-content
          PATTERNLY_CONTENT_HISTORICAL_ROOT: ${{ github.workspace }}/patternly-content-historical
          PATTERNLY_CONTENT_EXPECTED_CURRENT_SHA: ${{ steps.current-content.outputs.sha }}
        run: npm run baseline:report

  content-release-cross-repository-contract:
    name: Multi-track content release contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app
      - id: content-lock
        name: Read immutable content lock
        working-directory: app
        shell: bash
        run: |
          content_producer_pin="$(node scripts/candidateContentReleaseLock.mjs producer-pin)"
          historical_producer_pin="$(node scripts/candidateContentReleaseLock.mjs historical-producer-pin)"
          printf 'commit=%s\nhistorical-commit=%s\n' "$content_producer_pin" "$historical_producer_pin" >> "$GITHUB_OUTPUT"
      - name: Checkout locked content producer
        uses: actions/checkout@v4
        with:
          repository: lukaszkurczab/patternly-content
          ref: ${{ steps.content-lock.outputs.historical-commit }}
          path: patternly-content-historical
          fetch-depth: 0
      - name: Checkout current content producer
        uses: actions/checkout@v4
        with:
          repository: lukaszkurczab/patternly-content
          ref: master
          path: patternly-content
          fetch-depth: 0
      - id: current-content
        name: Record exact current and historical content inputs
        shell: bash
        env:
          EXPECTED_HISTORICAL_CONTENT_SHA: ${{ steps.content-lock.outputs.historical-commit }}
          EXPECTED_CANDIDATE_SOURCE_SHA: ${{ steps.content-lock.outputs.commit }}
        run: |
          current_content_sha="$(git -C "$GITHUB_WORKSPACE/patternly-content" rev-parse HEAD)"
          historical_content_sha="$(git -C "$GITHUB_WORKSPACE/patternly-content-historical" rev-parse HEAD)"
          [[ "$current_content_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$historical_content_sha" == "$EXPECTED_HISTORICAL_CONTENT_SHA" ]]
          git -C "$GITHUB_WORKSPACE/patternly-content" cat-file -e "${EXPECTED_CANDIDATE_SOURCE_SHA}^{commit}"
          printf 'Current content input: %s\nHistorical content input: %s\n' "$current_content_sha" "$historical_content_sha"
          printf 'sha=%s\nhistorical-sha=%s\n' "$current_content_sha" "$historical_content_sha" >> "$GITHUB_OUTPUT"
      - name: Verify candidate-bound content release lock
        working-directory: app
        run: node scripts/candidateContentReleaseLock.mjs check
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
      - name: Install application dependencies
        working-directory: app
        run: npm ci
      - name: Run pinned multi-track release round-trip
        working-directory: app
        env:
          PATTERNLY_CONTENT_HISTORICAL_ROOT: ${{ github.workspace }}/patternly-content-historical
          PATTERNLY_CONTENT_CURRENT_ROOT: ${{ github.workspace }}/patternly-content
          PATTERNLY_CONTENT_EXPECTED_CURRENT_SHA: ${{ steps.current-content.outputs.sha }}
        run: npm run test:content-release-cross-repo
