appId: com.lkurczab.gcpacetrainer
name: Patternly UX/UI audit core app flow Android
tags:
  - ux-ui-audit
  - core-flow
  - android
---
- runFlow:
    file: ../helpers/launch-dev-client.yaml

- assertVisible: "Patternly"
- assertVisible: "Current track"
- takeScreenshot: "010-home-default-dark-android-regular"

- tapOn:
    id: "main-tab-bar-practice"
- waitForAnimationToEnd:
    timeout: 12000
- assertVisible: "Continue practice"
- assertVisible: "Start session"
- takeScreenshot: "020-main-navigation-practice-selected-dark-android-regular"

- tapOn: "Manage settings"
- waitForAnimationToEnd:
    timeout: 12000
- assertVisible: "Practice setup"
- assertVisible: "Session length"
- assertVisible: "Feedback mode"
- takeScreenshot: "030-primary-task-setup-default-dark-android-regular"

- tapOn: "10"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "031-primary-task-setup-selected-dark-android-regular"

- tapOn: "Start session"
- waitForAnimationToEnd:
    timeout: 12000
- assertVisible: "ITEM 1 OF 10"
- takeScreenshot: "040-primary-task-execution-default-dark-android-regular"

- tapOn:
    point: "50%,66%"
- tapOn: "Check Answer"
- waitForAnimationToEnd:
    timeout: 12000
- assertVisible:
    text: "Correct answer|Needs review"
- takeScreenshot: "050-feedback-result-completed-dark-android-regular"

- tapOn:
    id: "main-tab-bar-progress"
- waitForAnimationToEnd:
    timeout: 12000
- assertVisible: "Focus overview"
- takeScreenshot: "070-progress-statistics-current-data-dark-android-regular"

- tapOn:
    id: "main-tab-bar-settings"
- waitForAnimationToEnd:
    timeout: 12000
- assertVisible:
    id: "settings-screen"
- takeScreenshot: "080-settings-default-dark-android-regular"
