appId: com.lkurczab.patternly.sec03
---
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "94%,93%"
- scrollUntilVisible:
    element: { id: "premium-restore" }
    direction: DOWN
    timeout: 10000
    centerElement: false
    visibilityPercentage: 50
- assertVisible: { id: "premium-restore", enabled: true }
- scrollUntilVisible:
    element: { id: "premium-manage" }
    direction: DOWN
    timeout: 10000
    centerElement: false
    visibilityPercentage: 50
- assertVisible: { id: "premium-manage", enabled: true }
- tapOn: { id: "premium-restore" }
- scrollUntilVisible:
    element: { id: "premium-active" }
    direction: UP
    timeout: 10000
    centerElement: true
    visibilityPercentage: 50
- assertVisible: { id: "premium-active" }
- assertNotVisible: { id: "premium-purchase" }
- takeScreenshot: "restore-disabled-checkout-pl"
