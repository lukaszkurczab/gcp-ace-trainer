appId: com.lkurczab.patternly.sec03
---
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "94%,93%"
- scrollUntilVisible:
    element: { id: "${STATUS_ID}" }
    direction: DOWN
    timeout: 10000
    centerElement: true
    visibilityPercentage: 50
- assertVisible: { id: "${STATUS_ID}" }
- takeScreenshot: "${EVIDENCE_FILE}"
