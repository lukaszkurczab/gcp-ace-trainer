appId: com.lkurczab.patternly
name: 8D2 large recovery top and footer
# Capture-only: scroll gestures and screenshots, never activate hold/retry/return.
---
- openLink: "com.lkurczab.patternly://audit/show-encrypted-storage-recovery?presentation=base"
- extendedWaitUntil:
    visible:
      id: patternly:content:encrypted-storage:removal:base
    timeout: 15000
- swipe:
    start: "50%, 25%"
    end: "50%, 85%"
    duration: 300
- swipe:
    start: "50%, 25%"
    end: "50%, 85%"
    duration: 300
- swipe:
    start: "50%, 25%"
    end: "50%, 85%"
    duration: 300
- swipe:
