appId: com.lkurczab.patternly
name: Patternly PERSIST-13 — verify mounted probe after cold recovery
tags:
  - persist13
  - practice-ui-probe
---
- extendedWaitUntil:
    visible:
      text: "Stage: complete"
    timeout: 60000
- assertVisible: "PERSIST-13 practice_ui_probe recover: observed"
- assertVisible:
    id: "persist13-fixture-bootstrap"
    text: "Bootstrap ready: true"
- assertVisible:
    id: "persist13-fixture-journal"
    text: "Journal absent: true"
- assertVisible:
    id: "persist13-fixture-preserved-equal"
    text: "Preserved equal: true"
- assertVisible:
    id: "persist13-fixture-cleanup"
    text: "Fixture cleanup: true"
