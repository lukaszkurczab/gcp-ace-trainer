appId: com.lkurczab.patternly
name: Patternly PERSIST-13 — mount recovered committed feedback
tags:
  - persist13
  - practice-ui-probe
---
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- extendedWaitUntil:
    visible:
      id: "patternly:session:counter:.*:ordinal:1:length:10"
    timeout: 60000
- assertVisible:
    id: "patternly:session:question:.*"
- takeScreenshot: "${CAPTURE_PREFIX}-question-top"
- scrollUntilVisible:
    element:
      id: "patternly:session:reason:.*"
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible:
    id: "patternly:session:counter:.*:ordinal:1:length:10"
- assertVisible:
    id: "patternly:session:reason:.*"
- assertVisible:
    id: "patternly:session:continue:.*"
    enabled: true
- assertNotVisible:
    id: "patternly:session:details:.*"
- takeScreenshot: "${CAPTURE_PREFIX}-feedback-next"
