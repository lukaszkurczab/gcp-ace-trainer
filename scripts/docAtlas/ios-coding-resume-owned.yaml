# Relaunch the same native binary with verified RCT bundle-provider argument.
appId: com.lkurczab.patternly
---
- stopApp
- launchApp:
    clearState: false
    arguments:
      RCT_jsLocation: "localhost:8083"
- extendedWaitUntil:
    visible:
      id: "patternly:content:ready"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "patternly:resume:continue:.*"
    commands:
      - tapOn:
          id: "patternly:resume:continue:.*"
- scrollUntilVisible:
    element:
      id: "patternly:session:result:.*:correct"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "patternly:session:result:.*:correct"
- takeScreenshot: atlas-23-answer-after-cold-resume
