# Guided Practice at ordinal 2 or its saved feedback. Never re-submit saved answers.
appId: com.lkurczab.patternly
---
- assertVisible:
    id: "patternly:session:counter:.*:ordinal:2:length:10"
- runFlow:
    when:
      visible:
        id: "patternly:session:submit:.*"
    commands:
      - scrollUntilVisible:
          element:
            id: "patternly:session:option:.*"
            index: 0
          direction: DOWN
          centerElement: true
          timeout: 15000
      - tapOn:
          id: "patternly:session:option:.*"
          index: 0
      - tapOn:
          id: "patternly:session:submit:.*"
- scrollUntilVisible:
    element:
      id: "patternly:session:feedback:.*"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "patternly:session:feedback:.*"
- takeScreenshot: atlas-answer-02
