    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "patternly:summary:review-answers:.*"
- scrollUntilVisible:
    element:
      id: "patternly:summary:feedback-item:.*"
      index: 0
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "patternly:summary:feedback-item:.*"
    index: 0
- assertVisible:
    id: "patternly:practice-review:root:.*"
- takeScreenshot: atlas-25-answer-review
- tapOn:
    id: "patternly:practice-review:result"
- scrollUntilVisible:
    element:
      id: "patternly:summary:back-to-practice:.*"
    direction: DOWN
    centerElement: false
    timeout: 15000
- tapOn:
    id: "patternly:summary:back-to-practice:.*"
- assertVisible:
    id: "patternly:practice:hub:root"
- tapOn:
    id: main-tab-bar-home
- stopApp
- launchApp:
    clearState: false
    arguments:
      RCT_jsLocation: "localhost:8083"
- extendedWaitUntil:
    visible:
      id: "patternly:home:change-track"
    timeout: 30000
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- assertNotVisible:
    id: "patternly:resume:continue:.*"
- takeScreenshot: atlas-26-completion-after-cold-start
