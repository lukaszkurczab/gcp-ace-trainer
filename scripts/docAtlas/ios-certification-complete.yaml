    timeout: 20000
- takeScreenshot: atlas-43-certification-complete
- scrollUntilVisible:
    element:
      id: "patternly:summary:review-answers:.*"
    direction: DOWN
    speed: 90
    timeout: 15000
- tapOn:
    id: "patternly:summary:review-answers:.*"
- assertVisible:
    id: "patternly:practice-review:root:.*"
- takeScreenshot: atlas-44-certification-review
- tapOn:
    id: "patternly:practice-review:result"
- scrollUntilVisible:
    element:
      id: "patternly:summary:back-to-practice:.*"
    direction: DOWN
    speed: 90
    timeout: 15000
- tapOn:
    id: "patternly:summary:back-to-practice:.*"
- tapOn:
    id: main-tab-bar-home
- stopApp
- launchApp:
    clearState: false
    arguments:
      RCT_jsLocation: "localhost:8083"
- extendedWaitUntil:
    visible:
      id: "patternly:home:change-track"
    timeout: 30000
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- assertNotVisible:
    id: "patternly:resume:continue:.*"
- takeScreenshot: atlas-45-certification-after-cold-start
- tapOn:
    id: main-tab-bar-progress
- assertVisible:
    id: "patternly:activity:row:google-cloud-associate-cloud-engineer:certification-focus-practice:.*"
- takeScreenshot: atlas-46-completed-history
- tapOn:
    id: main-tab-bar-home
