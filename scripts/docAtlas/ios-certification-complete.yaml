# Continue verified Certification Focus at first saved feedback, complete ten answers.
appId: com.lkurczab.patternly
---
- tapOn:
    id: "patternly:session:continue:.*"
- assertVisible:
    id: "patternly:session:counter:.*:ordinal:2:length:10"
- scrollUntilVisible:
    element:
      id: "patternly:session:option:.*"
      index: 0
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "patternly:session:option:.*"
    index: 0
- tapOn:
    id: "patternly:session:submit:.*"
- scrollUntilVisible:
